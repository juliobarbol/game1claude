<meta charset="utf-8">
<title>Clase — Curso de inglés</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E3A63">
<link rel="stylesheet" href="estilo.css">
<script src="tema.js"></script>

<nav class="bar">
  <div class="bar-in">
    <a class="home" href="../index.html">← Curso</a>
    <span class="spacer"></span>
    <div class="jump" id="nav"></div>
    <div class="jump" id="version"></div>
    <a class="imprimir" id="imprimir" href="#">Imprimir / PDF</a>
    <button data-tema-boton type="button" class="tema"></button>
  </div>
</nav>

<div class="wrap" id="app"></div>

<script src="data/indice.js"></script>
<script src="render.js"></script>
<script>
// Esta página solo elige QUÉ clase y CÓMO, y se lo pide a render.js.
(function (){
  const params = new URLSearchParams(location.search);
  const esc = RENDER.esc;

  const id = (params.get('u') || '').trim()
             || (CURSO.todas().filter(u => u.estado === 'listo')[0] || {}).id;
  const profe = params.get('v') === 'profesor';

  function error(titulo, detalle){
    document.getElementById('app').innerHTML =
      `<div class="oops"><h2>${esc(titulo)}</h2><p>${detalle}</p></div>`;
  }

  if (!id) return error('Todavía no hay ninguna clase armada',
    'Agregá una unidad con <code>estado: \'listo\'</code> en <code>curso/data/indice.js</code>.');

  const ficha = CURSO.buscar(id);
  if (!ficha) return error('Esa clase no está en el índice',
    `No hay ninguna unidad con id <code>${esc(id)}</code> en <code>curso/data/indice.js</code>.`);

  // Los datos se cargan con un <script> inyectado y no con fetch(): así la
  // página también anda abierta con doble clic (file://), sin servidor.
  window.CLASES = window.CLASES || {};
  const s = document.createElement('script');
  s.src = 'data/' + id + '.js';

  s.onload = function (){
    const c = CLASES[id];
    if (!c) return error('El archivo cargó pero no declaró la clase',
      `<code>curso/data/${esc(id)}.js</code> tiene que hacer <code>CLASES['${esc(id)}'] = { … }</code>.`);
    try { dibujar(c); }
    catch (e){ error('No se pudo dibujar la clase', `<code>${esc(e.message)}</code>`); }
  };
  s.onerror = function (){
    error('Esta clase todavía no está armada',
      `Falta el archivo <code>curso/data/${esc(id)}.js</code>. En el índice figura como <b>${esc(ficha.titulo)}</b>.`);
  };
  document.head.appendChild(s);

  function dibujar(c){
    document.title = `Clase ${String(c.clase).padStart(2,'0')} · ${c.titulo}` +
      (profe ? ' · profesora' : '') + ` — Nivel ${c.nivel} Parte ${c.parte}`;

    document.getElementById('app').innerHTML =
      RENDER.clase(c, { profe: profe, botones: true }) +
      `<footer>
        <a href="../index.html">← Todas las clases</a>
        <a href="nivel-1/parte-1/syllabus.html">Syllabus de la Parte 1</a>
        <span>Clase ${String(c.clase).padStart(2,'0')} · ${esc(c.codigo)} — ${esc(c.titulo)}</span>
      </footer>`;

    RENDER.conectar(document);
    barra(c);
    if (window.TEMA) TEMA.conectar();
  }

  function barra(c){
    // anterior / siguiente entre las clases que ya están armadas
    const todas = CURSO.todas();
    const i = todas.findIndex(u => u.id === c.id);
    const listas = todas.filter(u => u.estado === 'listo');
    const antes  = listas.filter(u => todas.indexOf(u) < i).pop();
    const luego  = listas.find(u => todas.indexOf(u) > i);
    const v = profe ? '&v=profesor' : '';

    document.getElementById('nav').innerHTML =
      (antes ? `<a class="g" href="clase.html?u=${antes.id}${v}">← ${esc(antes.codigo)}</a>` : '') +
      `<a class="g" href="#grammar">Grammar</a>` +
      `<a class="v" href="#vocabulary">Vocabulary</a>` +
      `<a class="s" href="#speak">Speaking</a>` +
      (luego ? `<a class="g" href="clase.html?u=${luego.id}${v}">${esc(luego.codigo)} →</a>` : '');

    // alumno / profesora
    document.getElementById('version').innerHTML =
      `<a href="clase.html?u=${c.id}" class="${profe ? '' : 'activo'}">Alumno</a>` +
      `<a href="clase.html?u=${c.id}&v=profesor" class="${profe ? 'activo' : ''}">Profesora</a>`;

    document.getElementById('imprimir').href =
      `imprimir.html?u=${c.id}${profe ? '&v=profesor' : ''}`;
  }
})();
</script>
