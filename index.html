<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#0a0d16">
<meta name="description" content="FILO — plataformas de precisión. Saltá, rebotá en las paredes y dasheá. Cronómetro, fantasma de tu mejor vuelta y medallas.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FILO — plataformas de precisión</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   FILO — estilos. Todo el look de la app: la partida se dibuja en el
   <canvas>; acá viven el HUD, los controles táctiles y las pantallas.
   ══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#0a0d16; --bg2:#111726; --panel:#151d31; --line:#26304d;
  --txt:#e7ecf7; --dim:#8d9ab8; --acc:#ffd166; --acc2:#5ec8ff;
  --ok:#4ade80; --bad:#ff4757; --gold:#ffd166; --silver:#c7d2e4; --bronze:#d08b52;
  --ctrl:180px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0; overflow:hidden; overscroll-behavior:none; touch-action:none}
body{
  background:var(--bg); color:var(--txt);
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  font-size:15px; line-height:1.4; user-select:none; -webkit-user-select:none;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
.hidden{display:none !important}

/* ── Escenario y canvas ─────────────────────────────────────────── */
#stage{position:fixed; left:0; right:0; top:0; bottom:0; overflow:hidden}
body.touch.portrait #stage{top:var(--hud-h); bottom:calc(var(--ctrl) + var(--safe-b))}
body.touch.portrait .tz{align-items:flex-end; padding-bottom:26px}
#cv{display:block; width:100%; height:100%; image-rendering:auto}

/* Franja de objetivos: en vertical sobra pantalla debajo de la sala, y ese
   hueco es el mejor lugar para recordarte contra qué estás corriendo. */
#goals{position:fixed; left:0; right:0; top:calc(var(--hud-h) + var(--sala-h));
  display:none; padding:16px; text-align:center; color:var(--dim); font-size:12px;
  line-height:2; letter-spacing:1px; pointer-events:none; z-index:4}
body.touch.portrait #goals{display:block}
#goals .g-lv{color:var(--txt); font-size:14px; letter-spacing:2px; margin-bottom:6px}
#goals b{color:var(--acc); font-weight:700}

/* ── HUD ────────────────────────────────────────────────────────── */
#hud{
  position:fixed; left:0; right:0; top:0; display:flex; align-items:center; gap:10px;
  padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px; pointer-events:none;
  font-size:13px; letter-spacing:.5px; z-index:5;
}
#hud.hidden{display:none !important}
#hud .grow{flex:1; min-width:0}
#hud .lv{color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#hud .time{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:0}
#hud .sub{color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums}
#hud .rec{color:var(--acc)}
#hud .hbtn{pointer-events:auto; width:38px; height:38px; border-radius:11px; background:#ffffff12;
  display:grid; place-items:center; font-size:15px; color:var(--txt)}
#hud .hbtn:active{background:#ffffff24}
#hud .center{text-align:center}
#hud .right{text-align:right}

/* ── Controles táctiles ─────────────────────────────────────────── */
#touch{position:fixed; inset:auto 0 0 0; height:calc(var(--ctrl) + var(--safe-b));
  padding:0 0 var(--safe-b); display:none; z-index:6; touch-action:none; pointer-events:none}
body.touch #touch{display:block}
body.touch.portrait #touch{background:linear-gradient(180deg,transparent 0%,transparent 45%,#0c111d 100%)}
body.touch.landscape #touch{background:none; height:100%; padding-bottom:0}
.tz{position:absolute; bottom:0; height:100%; display:flex; align-items:center;
  touch-action:none; pointer-events:auto}
/* El joystick vive PEGADO al borde del teléfono: en apaisado los controles
   se dibujan encima del juego, así que cuanto más al costado, menos tapan. */
#tstick{left:0; width:46%}
#tbtns{right:0; width:54%; justify-content:flex-end; gap:14px;
  padding-right:calc(10px + env(safe-area-inset-right,0px))}
body.swap #tstick{left:auto; right:0}
body.swap #tbtns{right:auto; left:0; justify-content:flex-start; padding-right:0;
  padding-left:calc(10px + env(safe-area-inset-left,0px)); flex-direction:row-reverse}
body.touch.landscape .tz{height:58%; bottom:calc(6px + var(--safe-b))}
body.touch.landscape #tstick{width:38%}
body.touch.landscape #tbtns{width:44%}

.stickbase{position:absolute; width:126px; height:126px; margin:-63px 0 0 -63px; border-radius:50%;
  background:#ffffff0a; border:2px solid #ffffff1a; transition:left .18s, top .18s, opacity .18s;
  opacity:.55}
.stickbase.on{transition:none; opacity:1}
body.touch.landscape .stickbase{background:#ffffff08; border-color:#ffffff14; opacity:.4}
body.touch.landscape .stickbase.on{opacity:.9}
.stickknob{position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px;
  border-radius:50%; background:#ffffff26; border:2px solid #ffffff33;
  transition:background .08s}
.stickbase.on .stickknob{background:var(--acc2); border-color:#fff6}
.tbtn{width:86px; height:86px; border-radius:50%; background:#ffffff14; border:2px solid #ffffff26;
  font-size:12px; font-weight:700; letter-spacing:1px; color:#dbe4f7; display:grid; place-items:center}
.tbtn.big{width:104px; height:104px; font-size:13px}
.tbtn.on{background:var(--acc2); color:#04121c; border-color:#fff8}
#btnDash.on{background:#e879f9; color:#1a0620}
#btnDash.dim{opacity:.38}
body.touch.landscape .tbtn{background:#ffffff10}

/* ── Pantallas (menú, niveles, opciones, pausa, resultado) ──────── */
#screens{position:fixed; inset:0; z-index:10; display:none}
#screens.on{display:block}
.screen{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:14px; padding:calc(18px + env(safe-area-inset-top,0px)) 18px
  calc(18px + var(--safe-b)); background:rgba(6,9,16,.9); backdrop-filter:blur(6px);
  overflow-y:auto; overscroll-behavior:contain; text-align:center}
.screen.hidden{display:none}
.title{font-size:clamp(38px,12vw,84px); font-weight:800; letter-spacing:10px; margin:0 0 -6px;
  color:var(--acc); text-shadow:0 0 26px #ffd16655}
.tagline{color:var(--dim); font-size:13px; letter-spacing:2px; margin-bottom:10px}
h2{font-size:20px; letter-spacing:3px; margin:0 0 4px; font-weight:700}
.menu{display:flex; flex-direction:column; gap:10px; width:min(320px,86vw)}
.btn{padding:13px 16px; border-radius:13px; background:var(--panel); border:1px solid var(--line);
  font-weight:700; letter-spacing:2px; font-size:14px; transition:transform .06s, background .12s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc); color:#20180a; border-color:#ffe1a0}
.btn.ghost{background:#ffffff0d}
.btn.row{display:flex; justify-content:space-between; align-items:center; gap:10px; letter-spacing:1px}
.btn small{color:var(--dim); font-weight:400; letter-spacing:0}
.hintline{color:var(--dim); font-size:12px; max-width:520px; line-height:1.7}
kbd{background:#ffffff14; border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:12px}

/* Selector de niveles */
.worlds{width:min(680px,94vw); display:flex; flex-direction:column; gap:16px}
.world h3{margin:0 0 8px; font-size:13px; letter-spacing:3px; color:var(--dim); text-align:left}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:9px}
.cell{position:relative; aspect-ratio:1/.86; border-radius:12px; background:var(--panel);
  border:1px solid var(--line); display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; padding:4px}
.cell:active{transform:scale(.96)}
.cell .n{font-size:19px; font-weight:800}
.cell .t{font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums}
.cell .m{position:absolute; top:5px; right:7px; font-size:12px}
.cell .st{position:absolute; top:5px; left:7px; font-size:11px; opacity:.85}
.cell.done{border-color:#2f7d52}
.cell.gold{border-color:var(--gold); box-shadow:0 0 0 1px #ffd16644 inset}
.cell.lock{opacity:.4}
.cell.cur{outline:2px solid var(--acc2); outline-offset:1px}

/* Resultado */
.bigtime{font-size:clamp(44px,14vw,72px); font-weight:800; font-variant-numeric:tabular-nums;
  letter-spacing:-1px; margin:0}
.delta{font-size:16px; font-weight:700}
.delta.good{color:var(--ok)} .delta.bad{color:var(--dim)}
.medals{display:flex; gap:14px; justify-content:center; color:var(--dim); font-size:12px; flex-wrap:wrap}
.medals b{color:var(--txt); font-weight:600}
.statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;
  width:min(560px,92vw)}
.stat{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px}
.stat .k{color:var(--dim); font-size:11px; letter-spacing:2px}
.stat .v{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums}
.opt{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 14px;
  border-radius:12px; background:var(--panel); border:1px solid var(--line); width:min(420px,90vw)}
.opt .val{font-weight:700; color:var(--acc)}
.toast{position:fixed; left:50%; top:14%; transform:translateX(-50%); background:#000a; z-index:20;
  border:1px solid var(--line); border-radius:10px; padding:9px 15px; font-size:13px;
  pointer-events:none; opacity:0; transition:opacity .2s}
.toast.on{opacity:1}
/* El parcial del maratón: aparece grande un segundo al pasar de nivel. Es
   el único momento en que el juego te dice, con un número, que mejoraste. */
.split{position:fixed; left:50%; top:26%; transform:translateX(-50%); z-index:21; text-align:center;
  pointer-events:none; opacity:0; transition:opacity .25s, transform .25s; font-variant-numeric:tabular-nums}
.split.on{opacity:1; transform:translateX(-50%) translateY(-10px)}
.split .d{font-size:clamp(30px,9vw,48px); font-weight:800; letter-spacing:-1px}
.split .l{font-size:12px; letter-spacing:2px; color:var(--dim)}
.split.good .d{color:var(--ok)} .split.bad .d{color:#ff8f8f} .split.neu .d{color:var(--txt)}
/* Lista de maratones (mundos + juego entero) */
.runlist{display:flex; flex-direction:column; gap:8px; width:min(560px,92vw)}
.runrow{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px;
  background:var(--panel); border:1px solid var(--line); text-align:left; color:var(--txt);
  font:inherit; cursor:pointer}
.runrow:disabled{opacity:.4; cursor:default}
.runrow .rn{flex:1; min-width:0; font-weight:700; letter-spacing:1px; overflow:hidden; text-overflow:ellipsis}
.runrow .rt{font-variant-numeric:tabular-nums; color:var(--acc); font-weight:700}
.runrow .rs{font-size:11px; color:var(--dim)}
.splitlist{display:flex; flex-direction:column; gap:2px; width:min(420px,90vw);
  font-size:12px; font-variant-numeric:tabular-nums; color:var(--dim)}
.splitlist div{display:flex; justify-content:space-between; gap:10px}
.splitlist b{color:var(--txt); font-weight:600}
.chips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; width:min(560px,92vw)}
.chip{padding:6px 11px; border-radius:999px; background:var(--panel); border:1px solid var(--line);
  color:var(--dim); font:inherit; font-size:12px; letter-spacing:1px; cursor:pointer}
.chip.on{color:var(--txt); border-color:var(--acc2); background:#ffffff10}
.tbrow{display:flex; align-items:center; gap:12px; padding:9px 14px; border-radius:10px;
  background:var(--panel); border:1px solid var(--line)}
.tbrow .pos{width:26px; color:var(--dim); font-variant-numeric:tabular-nums}
.tbrow .who{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tbrow .tm{font-variant-numeric:tabular-nums; font-weight:700}
.tbrow.yo{border-color:var(--acc2)} .tbrow.yo .who{color:var(--acc)}
</style>
</head>
<body>

<div id="stage"><canvas id="cv"></canvas></div>
<div id="goals"></div>

<div id="hud" class="hidden">
  <div class="grow lv"><div id="hudLv">—</div><div class="sub" id="hudRun"></div></div>
  <div class="center">
    <div class="time" id="hudTime">0.00</div>
    <div class="sub" id="hudBest">—</div>
  </div>
  <div class="grow right">
    <div class="sub" id="hudDeaths">☠ 0</div>
  </div>
  <button class="hbtn" id="btnRetry" title="Reintentar (R)">↺</button>
  <button class="hbtn" id="btnPause" title="Pausa (Esc)">❚❚</button>
</div>

<div id="touch">
  <div class="tz" id="tstick"><div class="stickbase" id="stickBase"><div class="stickknob" id="stickKnob"></div></div></div>
  <div class="tz" id="tbtns">
    <button class="tbtn" id="btnDash">DASH</button>
    <button class="tbtn big" id="btnJump">SALTO</button>
  </div>
</div>

<div id="screens" class="on">

  <section class="screen" id="scr-menu">
    <h1 class="title">FILO</h1>
    <div class="tagline">PLATAFORMAS DE PRECISIÓN</div>
    <div class="menu">
      <button class="btn pri" id="mPlay">JUGAR</button>
      <button class="btn" id="mLevels">NIVELES</button>
      <button class="btn" id="mRuns">MARATÓN</button>
      <button class="btn" id="mTabla">TABLA</button>
      <button class="btn" id="mStats">ESTADÍSTICAS</button>
      <button class="btn" id="mOpts">OPCIONES</button>
    </div>
    <div class="hintline" id="menuHint"></div>
  </section>

  <section class="screen hidden" id="scr-levels">
    <h2>NIVELES</h2>
    <div class="worlds" id="lvWorlds"></div>
    <button class="btn ghost" id="lvBack" style="width:min(320px,86vw)">VOLVER</button>
  </section>

  <section class="screen hidden" id="scr-win">
    <div class="tagline" id="winLv">NIVEL</div>
    <p class="bigtime" id="winTime">0.00</p>
    <div class="delta" id="winDelta"></div>
    <div class="medals" id="winMedals"></div>
    <div class="menu">
      <button class="btn pri" id="winNext">SIGUIENTE →</button>
      <button class="btn" id="winRetry">REINTENTAR</button>
      <button class="btn ghost" id="winMenu">NIVELES</button>
    </div>
  </section>

  <section class="screen hidden" id="scr-runs">
    <h2>MARATÓN</h2>
    <div class="chips" id="runModo"></div>
    <div class="hintline" id="runsHint"></div>
    <div class="runlist" id="runList"></div>
    <button class="btn ghost" id="runsBack" style="width:min(320px,86vw)">VOLVER</button>
  </section>

  <section class="screen hidden" id="scr-tabla">
    <h2>TABLA</h2>
    <div class="chips" id="tbChips"></div>
    <div class="runlist" id="tbList"></div>
    <div class="hintline" id="tbHint"></div>
    <button class="btn ghost" id="tbBack" style="width:min(320px,86vw)">VOLVER</button>
  </section>

  <section class="screen hidden" id="scr-runend">
    <div class="tagline" id="reName">MARATÓN</div>
    <p class="bigtime" id="reTime">0.00</p>
    <div class="delta" id="reDelta"></div>
    <div class="medals" id="reInfo"></div>
    <div class="splitlist" id="reSplits"></div>
    <div class="menu">
      <button class="btn pri" id="reAgain">OTRA VEZ</button>
      <button class="btn" id="reTabla">VER TABLA</button>
      <button class="btn ghost" id="reMenu">VOLVER</button>
    </div>
  </section>

  <section class="screen hidden" id="scr-abil">
    <div class="tagline" id="abTag">NUEVA HABILIDAD</div>
    <h1 class="title" id="abTitle" style="font-size:clamp(26px,8vw,52px); letter-spacing:6px">DASH</h1>
    <div class="hintline" id="abDesc"></div>
    <div class="menu"><button class="btn pri" id="abGo">A PROBARLA</button></div>
  </section>

  <section class="screen hidden" id="scr-pause">
    <h2>PAUSA</h2>
    <div class="menu">
      <button class="btn pri" id="pResume">SEGUIR</button>
      <button class="btn" id="pRetry">REINTENTAR</button>
      <button class="btn" id="pOpts">OPCIONES</button>
      <button class="btn ghost" id="pMenu">SALIR AL MENÚ</button>
    </div>
    <div class="hintline" id="pauseHint"></div>
  </section>

  <section class="screen hidden" id="scr-opts">
    <h2>OPCIONES</h2>
    <div class="opt"><span>Fantasma del récord</span><button class="val" id="oGhost">SÍ</button></div>
    <div class="opt"><span>Sonido</span><button class="val" id="oSound">SÍ</button></div>
    <div class="opt"><span>Vibración</span><button class="val" id="oVibe">SÍ</button></div>
    <div class="opt"><span>Sacudida de pantalla</span><button class="val" id="oShake">SÍ</button></div>
    <div class="opt"><span>Controles zurdo/diestro</span><button class="val" id="oSwap">DIESTRO</button></div>
    <div class="opt"><span>Modo espejo</span><button class="val" id="oMirror">NO</button></div>
    <div class="opt"><span>Tu nombre</span><button class="val" id="oName">—</button></div>
    <div class="opt"><span>Ayudas en pantalla</span><button class="val" id="oHints">SÍ</button></div>
    <div class="menu" style="margin-top:6px">
      <button class="btn ghost" id="oBack">VOLVER</button>
      <button class="btn ghost" id="oReset" style="color:var(--bad)">BORRAR PROGRESO</button>
    </div>
  </section>

  <section class="screen hidden" id="scr-stats">
    <h2>ESTADÍSTICAS</h2>
    <div class="statgrid" id="statGrid"></div>
    <div class="hintline" id="statHint"></div>
    <button class="btn ghost" id="sBack" style="width:min(320px,86vw)">VOLVER</button>
  </section>

</div>

<div class="toast" id="toast"></div>
<div class="split" id="split"><div class="d" id="splitD"></div><div class="l" id="splitL"></div></div>

<script>
// ═══════════════════════════════════════════════════════════════════
// FILO — plataformas de precisión.
//
// Todo el juego vive en este archivo (igual que las otras apps del
// dueño: sin build, sin frameworks, JS vanilla en ámbito global).
// El código está partido en secciones marcadas con  // ===== js/x.js =====
// Buscá esos marcadores en vez de fiarte de los números de línea.
//
// La sección js/physics.js NO toca el DOM a propósito: se puede correr
// en node (lo hace test/solver.test.cjs, que verifica que cada nivel sea
// realmente terminable y de dónde salen los tiempos de las medallas).
// ═══════════════════════════════════════════════════════════════════

// ===== js/const.js =====
// Unidades: píxeles lógicos. 1 tile = 16. El paso de simulación es FIJO
// (1/60 s) — es lo que hace que el juego sea determinista y que un truco
// que te salió una vez te vuelva a salir siempre. NO pasar a delta-time.
const TS   = 16;              // lado del tile
const ROOM_W = 30, ROOM_H = 17;               // tamaño de sala, en tiles
const VIEW_W = ROOM_W * TS, VIEW_H = ROOM_H * TS;  // 480 x 272
const DT   = 1 / 60;

const PW = 11, PH = 15;       // hitbox del jugador (más angosta que un tile)

const PHY = {
  RUN:        170,   // velocidad máxima al correr (px/s)
  ACC_G:     1500,   // aceleración en piso
  DEC_G:     1900,   // frenado en piso
  ACC_A:     1150,   // aceleración en aire
  DEC_A:      900,   // frenado en aire
  GRAV:      1250,
  GRAV_APEX:  820,   // gravedad reducida cerca del pico del salto (control fino)
  APEX:        45,   // |vy| por debajo del cual estás "en el pico"
  MAX_FALL:   430,
  JUMP:       350,   // impulso de salto
  JUMP_CUT:  .42,    // al soltar, se recorta la subida → salto de altura variable
  COYOTE:       6,   // frames de gracia para saltar tras dejar el piso
  BUFFER:       8,   // frames de gracia para que un salto apretado antes valga
  WALL_SLIDE:  92,   // caída máxima pegado a la pared
  WALL_COYOTE:  6,
  WJ_X:       205,   // patada horizontal del salto de pared
  WJ_Y:       335,
  WJ_LOCK:      9,   // frames en que el input horizontal no manda (salto comprometido)
  DASH:       335,
  DASH_F:      10,   // duración del dash, en frames
  DASH_FREEZE:  3,   // hitstop al arrancar el dash (se siente el golpe)
  DASH_END:   .52,   // cuánta velocidad queda al terminar
  SPRING:     500,
  CORNER:       4,   // corrección de esquina contra el techo (px)
  DEATH_F:     20,   // frames de la animación de muerte
  CRUMB_F:     26,   // lo que aguanta un bloque frágil pisado
  CRUMB_BACK: 110,   // lo que tarda en volver
  CRYSTAL_BACK: 90,
};

// Códigos de tile (grilla estática)
const T_EMPTY=0, T_SOLID=1, T_SP_U=2, T_SP_D=3, T_SP_L=4, T_SP_R=5, T_ONEWAY=6,
      T_SPRING=7, T_CRUMB=8, T_PAD_D=9, T_PAD_U=10;

const COL = {
  bg:'#0a0d16', bg2:'#131b30', grid:'#1b2540', out:'#05070c',
  solid:'#222d4b', solidTop:'#5878b0', solidEdge:'#141b2d',

  player:'#ffd166', playerNo:'#7cc3ff',
  goal:'#4ade80', crystal:'#c084fc', spring:'#fb923c',
  crumb:'#8a6b45', mover:'#38bdf8', saw:'#ff4757', star:'#ffe066', pad:'#a78bfa',
  ghost:'#ffffff',
};

const LS = {
  SAVE:'filo_save_v1',
  OPTS:'filo_opts_v1',
  GHOST:'filo_ghost_',   // + índice de nivel (+ 'm' si es el espejo)

// ===== js/save.js =====
// Progreso y opciones en localStorage. Nada de backend: el récord es tuyo
// y vive en el aparato. Todo lo que entra se valida (un JSON tocado a mano
// no puede romper el juego).
const OPTS_DEF = { ghost:1, sound:1, vibe:1, shake:1, swap:0, hints:1, mirror:0, extremo:0 };
let SAVE = { v:1, lv:{}, run:{}, deaths:0, frames:0, wins:0 };
let OPTS = Object.assign({}, OPTS_DEF);

// El espejo es OTRO juego: las mismas salas, pero tu mano está al revés. Sus
// récords y sus fantasmas viven aparte, con una 'm' pegada a la clave — si
// compartieran casillero, el récord de un lado borraría el del otro y los
// dos dejarían de significar algo.
function modeSuf(){ return OPTS.mirror ? 'm' : ''; }
// El extremo NO entra en `modeSuf`: cambia cómo se mide un RECORRIDO, no las
// salas, así que los récords de nivel y los fantasmas son los mismos.
function runKey(k){ return k + modeSuf() + (OPTS.extremo ? 'x' : ''); }
function claveNet(k){ return k + (OPTS.extremo ? 'x' : ''); }

function lsGet(k){ try { return localStorage.getItem(k); } catch(_){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); return true; } catch(_){ return false; } }

function loadSave(){
  try {
    const raw = JSON.parse(lsGet(LS.SAVE) || '{}');
    const lv = {};
    const src = (raw && typeof raw.lv === 'object' && raw.lv) ? raw.lv : {};
    for (const k of Object.keys(src)){
      const e = src[k]; if (!e || typeof e !== 'object') continue;
      lv[k] = {
        best:    Number.isFinite(+e.best) && +e.best > 0 ? Math.floor(+e.best) : 0,
        deaths:  Math.max(0, Math.floor(+e.deaths || 0)),
        star:    !!e.star,
        noDeath: !!e.noDeath,
      };
    }
    // Maratones: una entrada por recorrido (un mundo, o el juego entero) con
    // el total y los parciales acumulados de la mejor vuelta. Los parciales
    // son contra lo que se corre en vivo, así que se guardan SOLO cuando el
    // total es récord: si no, se compararían pedazos de vueltas distintas.
    const run = {};
    const rsrc = (raw && typeof raw.run === 'object' && raw.run) ? raw.run : {};
    for (const k of Object.keys(rsrc)){
      const e = rsrc[k]; if (!e || typeof e !== 'object') continue;
      const best = Number.isFinite(+e.best) && +e.best > 0 ? Math.floor(+e.best) : 0;
      if (!best) continue;
      run[k] = {
        best,
        splits: Array.isArray(e.splits) ? e.splits.map(v => Math.max(0, Math.floor(+v || 0))) : [],
        deaths: Math.max(0, Math.floor(+e.deaths || 0)),
      };
    }
    SAVE = {
      v:1, lv, run,
      deaths: Math.max(0, Math.floor(+raw.deaths || 0)),
      frames: Math.max(0, Math.floor(+raw.frames || 0)),
      wins:   Math.max(0, Math.floor(+raw.wins   || 0)),
    };
  } catch(_){ SAVE = { v:1, lv:{}, run:{}, deaths:0, frames:0, wins:0 }; }
  try {
    const o = JSON.parse(lsGet(LS.OPTS) || '{}');
    for (const k of Object.keys(OPTS_DEF)) OPTS[k] = (o && k in o) ? (o[k] ? 1 : 0) : OPTS_DEF[k];
  } catch(_){ OPTS = Object.assign({}, OPTS_DEF); }
}
function saveSave(){ lsSet(LS.SAVE, JSON.stringify(SAVE)); }
function saveOpts(){ lsSet(LS.OPTS, JSON.stringify(OPTS)); }
// `suf` fuerza un espacio de récords concreto ('' = el normal). Sin él se usa
// el del modo en curso. Se pasa '' donde el récord tiene que ser el mismo
// mires de donde mires — el desbloqueo de niveles, por ejemplo: haber
// terminado el 7 normal ya te abre el 8, también en el espejo.
function lvRec(i, suf){
  const k = String(i) + (suf == null ? modeSuf() : suf);
  if (!SAVE.lv[k]) SAVE.lv[k] = { best:0, deaths:0, star:false, noDeath:false };
  return SAVE.lv[k];
}
function runRec(key){ return SAVE.run[key] || null; }
function ghostKey(i){ return LS.GHOST + i + modeSuf(); }
function wipeSave(){
  SAVE = { v:1, lv:{}, run:{}, deaths:0, frames:0, wins:0 };
  saveSave();
  for (let i = 0; i < LEVELS.length; i++) for (const s of ['', 'm'])
    { try { localStorage.removeItem(LS.GHOST + i + s); } catch(_){} }
}

// ===== js/audio.js =====
// Sonido sintetizado con WebAudio: cero archivos, cero descargas, funciona
// offline. Se despierta con el primer toque/tecla (política de autoplay).
const SND = { ctx:null, master:null };
function audioInit(){
  if (SND.ctx || !OPTS.sound) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    SND.ctx = new AC();
    SND.master = SND.ctx.createGain();
    SND.master.gain.value = .22;
    SND.master.connect(SND.ctx.destination);
  } catch(_){ SND.ctx = null; }
}
function audioResume(){ if (SND.ctx && SND.ctx.state === 'suspended') SND.ctx.resume().catch(()=>{}); }
function blip(f0, f1, dur, type, vol){
  if (!OPTS.sound) return;
  audioInit(); if (!SND.ctx) return;
  const t = SND.ctx.currentTime, o = SND.ctx.createOscillator(), g = SND.ctx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol == null ? .5 : vol, t + .008);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(SND.master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, hp){
  if (!OPTS.sound) return;
  audioInit(); if (!SND.ctx) return;
  const ctx = SND.ctx, n = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 700;
  const g = ctx.createGain(); g.gain.value = vol == null ? .35 : vol;
  src.connect(f); f.connect(g); g.connect(SND.master); src.start();
}
const SFX = {
  jump:   () => blip(430, 700, .10, 'square', .28),
  wall:   () => blip(330, 560, .10, 'square', .26),
  dash:   () => { noise(.16, .30, 900); blip(720, 240, .14, 'sawtooth', .16); },
  land:   () => blip(150, 90,  .06, 'sine',   .30),
  die:    () => { noise(.28, .34, 400); blip(300, 60, .3, 'sawtooth', .22); },
  crystal:() => blip(880, 1320, .10, 'triangle', .3),
  spring: () => blip(300, 900, .14, 'triangle', .32),
  star:   () => { blip(990, 990, .08, 'triangle', .3); setTimeout(()=>blip(1480,1480,.12,'triangle',.3), 80); },
  goal:   () => { [660, 880, 1320].forEach((f,i) => setTimeout(()=>blip(f, f, .14, 'triangle', .3), i*90)); },
  flip:   () => { blip(240, 620, .16, 'triangle', .3); noise(.12, .18, 500); },
  ui:     () => blip(520, 520, .05, 'square', .16),
};
function vibrate(ms){
  if (!OPTS.vibe) return;
  try { navigator.vibrate && navigator.vibrate(ms); } catch(_){}
}

// ===== js/input.js =====
// Un solo "mando virtual" para las tres entradas (teclado, gamepad, táctil).
// El juego lee SIEMPRE estados sostenidos (held); los flancos (recién
// apretado) los calcula la física comparando con el frame anterior — así el
// bot del test puede jugar con la misma interfaz que una persona.
const IN = { x:0, y:0, jump:false, dash:false };
const KEY = { left:false, right:false, up:false, down:false, jump:false, dash:false };
const TOUCH = { x:0, y:0, jump:false, dash:false };

const K_LEFT = ['ArrowLeft','KeyA'], K_RIGHT = ['ArrowRight','KeyD'];
const K_UP = ['ArrowUp','KeyW'], K_DOWN = ['ArrowDown','KeyS'];
const K_JUMP = ['Space','KeyZ','KeyK','KeyJ'], K_DASH = ['KeyX','KeyL','ShiftLeft','ShiftRight','KeyC'];

function keyHandler(e, down){
  const c = e.code;
  let hit = true;
  if (K_LEFT.includes(c)) KEY.left = down;
  else if (K_RIGHT.includes(c)) KEY.right = down;
  else if (K_UP.includes(c)) KEY.up = down;
  else if (K_DOWN.includes(c)) KEY.down = down;
  else if (K_JUMP.includes(c)) KEY.jump = down;
  else if (K_DASH.includes(c)) KEY.dash = down;
  else hit = false;
  if (down && !e.repeat){
    if (c === 'KeyR') retryLevel();
    else if (c === 'Escape' || c === 'KeyP') togglePause();
    else if (c === 'Enter' && GAME.mode !== 'play') uiEnter();
  }
  if (hit){ e.preventDefault(); audioResume(); }
}
addEventListener('keydown', e => keyHandler(e, true));
addEventListener('keyup',   e => keyHandler(e, false));
addEventListener('blur', () => {
  for (const k in KEY) KEY[k] = false;
  TOUCH.jump = TOUCH.dash = false; TOUCH.x = TOUCH.y = 0;
});

// — Gamepad: se lee por polling en cada frame —
function pollPad(out){
  let pads = [];
  try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch(_){ return; }
  for (const p of pads){
    if (!p || !p.connected) continue;
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0, b = p.buttons || [];
    const on = i => !!(b[i] && b[i].pressed);
    if (ax < -.4 || on(14)) out.x = -1; else if (ax > .4 || on(15)) out.x = 1;
    if (ay < -.4 || on(12)) out.y = -1; else if (ay > .4 || on(13)) out.y = 1;
    if (on(0) || on(3)) out.jump = true;
    if (on(1) || on(2) || on(5) || on(7) || on(4) || on(6)) out.dash = true;
    if (on(9) && !PAD_START){ PAD_START = true; togglePause(); }
    if (!on(9)) PAD_START = false;
  }
}
let PAD_START = false;

function pollInput(){
  let x = 0, y = 0;
  if (KEY.left)  x -= 1;
  if (KEY.right) x += 1;
  if (KEY.up)    y -= 1;
  if (KEY.down)  y += 1;
  let jump = KEY.jump, dash = KEY.dash;
  if (TOUCH.x) x = TOUCH.x;
  if (TOUCH.y) y = TOUCH.y;
  if (TOUCH.jump) jump = true;
  if (TOUCH.dash) dash = true;
  const pad = { x:0, y:0, jump:false, dash:false };
  pollPad(pad);
  if (pad.x) x = pad.x;
  if (pad.y) y = pad.y;
  if (pad.jump) jump = true;
  if (pad.dash) dash = true;
  IN.x = Math.sign(x); IN.y = Math.sign(y); IN.jump = !!jump; IN.dash = !!dash;
  return IN;
}

// — Táctil: joystick flotante + dos botones. El joystick nace donde apoyás
//   el dedo (no donde está dibujado) y da 8 direcciones digitales: en un
//   juego de precisión un analógico "a medias" arruina los saltos cortos. —
const STICK = { id:-1, ox:0, oy:0 };
const DEAD = 11, DEAD_Y = 16;

// La base del joystick se planta donde apoyaste el dedo y vuelve sola al
// rincón al soltar: así el dibujo coincide con dónde estás tocando de verdad
// (el control siempre fue flotante; antes el círculo mentía).
function stickHome(){
  const zone = document.getElementById('tstick'), base = document.getElementById('stickBase');
  if (!zone || !base) return;
  const r = zone.getBoundingClientRect();
  const izq = !document.body.classList.contains('swap');
  base.style.left = (izq ? 74 : r.width - 74) + 'px';
  base.style.top = (r.height * (document.body.classList.contains('portrait') ? .5 : .62)) + 'px';
}
function stickPlant(x, y){
  const zone = document.getElementById('tstick'), base = document.getElementById('stickBase');
  const r = zone.getBoundingClientRect();
  base.style.left = Math.max(66, Math.min(r.width - 66, x - r.left)) + 'px';
  base.style.top  = Math.max(66, Math.min(r.height - 30, y - r.top)) + 'px';
}
function stickSet(dx, dy){
  TOUCH.x = Math.abs(dx) > DEAD ? Math.sign(dx) : 0;
  TOUCH.y = Math.abs(dy) > DEAD_Y ? Math.sign(dy) : 0;
  const base = document.getElementById('stickBase'), knob = document.getElementById('stickKnob');
  const r = 34, m = Math.hypot(dx, dy) || 1, k = Math.min(1, r / m);
  knob.style.transform = `translate(${(dx*k).toFixed(1)}px,${(dy*k).toFixed(1)}px)`;
  base.classList.toggle('on', !!(TOUCH.x || TOUCH.y));
}
function stickReset(){
  STICK.id = -1; TOUCH.x = 0; TOUCH.y = 0;
  const base = document.getElementById('stickBase'), knob = document.getElementById('stickKnob');
  knob.style.transform = 'translate(0,0)'; base.classList.remove('on');
  stickHome();
}
function bindTouch(){
  const zone = document.getElementById('tstick');
  zone.addEventListener('pointerdown', e => {
    e.preventDefault(); markTouch(); audioResume();
    STICK.id = e.pointerId; STICK.ox = e.clientX; STICK.oy = e.clientY;
    zone.setPointerCapture(e.pointerId);
    stickPlant(e.clientX, e.clientY); stickSet(0,0);
  });
  zone.addEventListener('pointermove', e => {
    if (e.pointerId !== STICK.id) return;
    e.preventDefault();
    let dx = e.clientX - STICK.ox, dy = e.clientY - STICK.oy;
    // El origen "sigue" al dedo si te alejás mucho: evita que el stick se
    // trabe cuando el pulgar deriva durante una serie larga de saltos.
    const max = 52, m = Math.hypot(dx, dy);
    if (m > max){
      const f = (m - max) / m; STICK.ox += dx*f; STICK.oy += dy*f;
      dx = e.clientX - STICK.ox; dy = e.clientY - STICK.oy;
      stickPlant(STICK.ox, STICK.oy);
    }
    stickSet(dx, dy);
  });
  const end = e => { if (e.pointerId === STICK.id) stickReset(); };
  zone.addEventListener('pointerup', end);
  zone.addEventListener('pointercancel', end);
  zone.addEventListener('lostpointercapture', end);

  const btn = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); markTouch(); audioResume();
      TOUCH[key] = true; el.classList.add('on');
      try { el.setPointerCapture(e.pointerId); } catch(_){}
    });
    const up = e => { TOUCH[key] = false; el.classList.remove('on'); };
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('lostpointercapture', up);
  };
  btn('btnJump','jump'); btn('btnDash','dash');
}
let TOUCH_SEEN = false;
function markTouch(){
  if (TOUCH_SEEN) return;
  TOUCH_SEEN = true;
  document.body.classList.add('touch');
  layout();
}
// ===== js/physics.js =====
// EL NÚCLEO. Paso fijo de 1/60 s, sin lectura del DOM y sin Math.random:
// mismo estado + mismas teclas = mismo resultado, siempre. De eso depende
// que un truco difícil sea repetible (y que el bot de test/solver.test.cjs
// pueda jugar los niveles para demostrar que se pueden terminar).
//
// Todo lo que el mundo quiere contarle al resto del juego (sonido, polvo,
// sacudida) lo deja en w.events; física y presentación no se mezclan.

// — Espejo —
// Da vuelta la sala en horizontal. No es contenido nuevo: es el mismo nivel
// con las manos cambiadas, que es justo lo que el juego mide. La columna
// ascii `c` pasa a ser `27-c` (o sea, el tile `x` pasa a ser `ROOM_W-1-x`),
// los pinchos laterales cambian de lado, y las plataformas y sierras —que
// van en coordenadas de tile absolutas— se reflejan a mano. Un bloque de
// ancho `w` que empieza en `x` termina empezando en `ROOM_W - x - w`.
const ESPEJO_CH = { '<':'>', '>':'<' };
function espejarNivel(def){
  const rows = (def.rows || []).map(r =>
    r.split('').reverse().map(c => ESPEJO_CH[c] || c).join(''));
  const movers = (def.movers || []).map(m => {
    const w = m.w || 2, o = { x: ROOM_W - m.x - w, y: m.y, w, spd: m.spd };
    if (m.h != null) o.h = m.h;
    if (m.x2 != null) o.x2 = ROOM_W - m.x2 - w;
    if (m.y2 != null) o.y2 = m.y2;
    return o;
  });
  const saws = (def.saws || []).map(s => {
    const o = { x: ROOM_W - 1 - s.x, y: s.y, spd: s.spd };
    if (s.r != null) o.r = s.r;
    if (s.x2 != null) o.x2 = ROOM_W - 1 - s.x2;
    if (s.y2 != null) o.y2 = s.y2;
    return o;
  });
  return Object.assign({}, def, { rows, movers, saws });
}

function parseLevel(def){
  if (OPTS.mirror) def = espejarNivel(def);
  const rows = def.rows || [];
  const W = ROOM_W, H = ROOM_H;
  const tiles = new Uint8Array(W * H);
  const L = { w:W, h:H, name:def.n, hint:def.hint || '', tiles,
    spawn:{x:TS, y:TS}, goal:{x:TS, y:TS},
    crumbs:[], crAt:new Int32Array(W*H).fill(-1),
    crystals:[], cryAt:new Int32Array(W*H).fill(-1),
    stars:[], springs:[], movers:[], saws:[], par:def.par || [10,15,25],
    ab:{ wall:!!def.wall, dash:!!def.dash, grav:!!def.grav },
    grav0: def.gravInicial === -1 ? -1 : 1 };
  for (let ty = 0; ty < H; ty++){
    // Marco: la primera y la última fila/columna son siempre pared.
    const inner = (ty === 0 || ty === H-1) ? '#'.repeat(W-2) : (rows[ty-1] || '');
    for (let tx = 0; tx < W; tx++){
      const i = ty*W + tx;
      if (tx === 0 || tx === W-1){ tiles[i] = T_SOLID; continue; }
      const ch = inner[tx-1] || ' ';
      switch (ch){
        case '#': tiles[i] = T_SOLID; break;
        case '^': tiles[i] = T_SP_U; break;
        case 'v': tiles[i] = T_SP_D; break;
        case '<': tiles[i] = T_SP_L; break;
        case '>': tiles[i] = T_SP_R; break;
        case '=': tiles[i] = T_ONEWAY; break;
        case 's': tiles[i] = T_SPRING; break;
        case 'c': tiles[i] = T_CRUMB; L.crAt[i] = L.crumbs.length; L.crumbs.push(i); break;
        case 'd': tiles[i] = T_PAD_D; break;      // baldosa: gravedad hacia abajo
        case 'u': tiles[i] = T_PAD_U; break;      // baldosa: gravedad hacia arriba
        case 'o': L.cryAt[i] = L.crystals.length; L.crystals.push({ tx, ty }); break;
        case '*': L.stars.push({ tx, ty }); break;
        case 'P': L.spawn = { x: tx*TS + (TS-PW)/2, y: ty*TS + TS - PH }; break;
        case 'G': L.goal  = { x: tx*TS, y: ty*TS }; break;
      }
      if (tiles[i] === T_SPRING) L.springs.push({ tx, ty });
    }
  }
  for (const m of (def.movers || [])) L.movers.push({
    x:m.x*TS, y:m.y*TS, w:(m.w||2)*TS, h:(m.h||1)*TS,
    x2:(m.x2 == null ? m.x : m.x2)*TS, y2:(m.y2 == null ? m.y : m.y2)*TS, spd:(m.spd || 2)*TS,
  });
  for (const s of (def.saws || [])) L.saws.push({
    x:s.x*TS + TS/2, y:s.y*TS + TS/2, r:(s.r || .55)*TS,
    x2:(s.x2 == null ? s.x : s.x2)*TS + TS/2, y2:(s.y2 == null ? s.y : s.y2)*TS + TS/2,
    spd:(s.spd || 3)*TS,
  });
  return L;
}

function pathPos(a, b, spd, t){
  // Ida y vuelta a velocidad constante. Es una función del tiempo (no un
  // estado que se acumula): clonar el mundo para el solver sale gratis y
  // dos partidas con el mismo cronómetro ven las plataformas en el mismo lugar.
  const d = Math.hypot(b.x - a.x, b.y - a.y);
  if (d < .001 || spd <= 0) return { x:a.x, y:a.y };
  const per = 2*d/spd, u = ((t % per) + per) % per / per, k = u < .5 ? u*2 : 2 - u*2;
  return { x:a.x + (b.x - a.x)*k, y:a.y + (b.y - a.y)*k };
}
function moverRect(m, t){ const p = pathPos({x:m.x,y:m.y}, {x:m.x2,y:m.y2}, m.spd, t); return { x:p.x, y:p.y, w:m.w, h:m.h }; }
function sawPos(s, t){ return pathPos({x:s.x,y:s.y}, {x:s.x2,y:s.y2}, s.spd, t); }

function newWorld(idx){
  const L = (typeof idx === 'object') ? idx : parseLevel(LEVELS[idx]);
  const w = {
    L, idx: (typeof idx === 'object' ? -1 : idx),
    t:0, timer:0, started:false, deaths:0, freeze:0, shake:0, events:[],
    grav:1,                       // 1 = hacia abajo · -1 = hacia arriba
    prev:{ jump:false, dash:false },
    crSt:new Uint8Array(L.crumbs.length), crT:new Int16Array(L.crumbs.length),
    cryT:new Int16Array(L.crystals.length), starGot:new Uint8Array(L.stars.length),
    p:null,
  };
  resetAttempt(w, true);
  return w;
}
function resetAttempt(w, first){
  const L = w.L;
  w.p = { x:L.spawn.x, y:L.spawn.y, vx:0, vy:0, face:1, grounded:false, wall:0, wasGround:false,
    dash:0, dashDx:0, dashDy:0, dashAvail:true, coyote:0, wcoyote:0, wcdir:0, buf:0, lock:0,
    dead:0, win:0, anim:0, sqx:1, sqy:1 };
  w.crSt.fill(0); w.crT.fill(0); w.cryT.fill(0); w.starGot.fill(0);
  w.timer = 0; w.started = false; w.freeze = 0; w.grav = L.grav0;
  if (!first) w.events.push('spawn');
}
function cloneWorld(w){
  return {
    L:w.L, idx:w.idx, t:w.t, timer:w.timer, started:w.started, deaths:w.deaths,
    freeze:w.freeze, shake:0, events:[], grav:w.grav,
    prev:{ jump:w.prev.jump, dash:w.prev.dash },
    crSt:w.crSt.slice(), crT:w.crT.slice(), cryT:w.cryT.slice(), starGot:w.starGot.slice(),
    p:Object.assign({}, w.p),
  };
}

// — Consulta del terreno —
function tileAt(L, tx, ty){
  if (tx < 0 || ty < 0 || tx >= L.w || ty >= L.h) return T_SOLID;
  return L.tiles[ty*L.w + tx];
}
function solidTile(w, tx, ty){
  const t = tileAt(w.L, tx, ty);
  if (t === T_SOLID || t === T_SPRING) return true;
  if (t === T_CRUMB){
    const i = w.L.crAt[ty*w.L.w + tx];
    return i < 0 || w.crSt[i] < 2;      // 0 firme · 1 temblando · 2 roto
  }
  return false;
}
function rectSolid(w, x, y, ww, hh){
  const x0 = Math.floor(x/TS), x1 = Math.floor((x + ww - .001)/TS);
  const y0 = Math.floor(y/TS), y1 = Math.floor((y + hh - .001)/TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++)
    if (solidTile(w, tx, ty)) return true;
  return false;
}
function moverAt(w, x, y, ww, hh, tt){
  for (const m of w.L.movers){
    const r = moverRect(m, tt == null ? w.t*DT : tt);
    if (x < r.x + r.w && x + ww > r.x && y < r.y + r.h && y + hh > r.y) return m;
  }
  return null;
}
function blocked(w, x, y){
  return rectSolid(w, x, y, PW, PH) || !!moverAt(w, x, y, PW, PH);
}
// Plataformas atravesables ("=" ): solo frenan si venís cayendo y tus pies
// estaban por encima del borde. Se atraviesan de abajo hacia arriba.
// Devuelve la coordenada de la cara que te frena, o -1. Con la gravedad dada
// vuelta la plataforma atravesable se cruza al revés: siempre frena del lado
// contra el que caés y se atraviesa desde el otro.
function onewayHit(w, x, yNew, yOld, gv){
  gv = gv || 1;
  if ((yNew - yOld) * gv <= 0) return -1;
  const x0 = Math.floor(x/TS), x1 = Math.floor((x + PW - .001)/TS);
  const oldB = gv > 0 ? yOld + PH : yOld, newB = gv > 0 ? yNew + PH : yNew;
  const ty0 = Math.floor(Math.min(oldB, newB)/TS), ty1 = Math.floor(Math.max(oldB, newB - .001)/TS);
  for (let ty = ty0; ty <= ty1; ty++){
    const cara = gv > 0 ? ty*TS : ty*TS + TS;
    if ((oldB - cara) * gv > .001) continue;
    for (let tx = x0; tx <= x1; tx++) if (tileAt(w.L, tx, ty) === T_ONEWAY) return cara;
  }
  return -1;
}

function moveX(w, dx){
  const p = w.p, s = Math.sign(dx);
  let rem = Math.abs(dx);
  while (rem > 0){
    const st = Math.min(1, rem) * s;
    if (blocked(w, p.x + st, p.y)) return true;
    p.x += st; rem -= 1;
  }
  return false;
}
function moveY(w, dy){
  const p = w.p, s = Math.sign(dy);
  let rem = Math.abs(dy);
  while (rem > 0){
    const st = Math.min(1, rem) * s;
    const ny = p.y + st;
    const ow = onewayHit(w, p.x, ny, p.y, w.grav);
    if (ow >= 0){ p.y = w.grav > 0 ? ow - PH : ow; return w.grav; }
    if (blocked(w, p.x, ny)){
      if (s === -w.grav){
        // Corrección de esquina: si el techo te pega apenas del borde, el
        // juego te corre unos píxeles en vez de cortarte el salto. Es la
        // diferencia entre "me equivoqué" y "el juego me robó".
        for (let d = 1; d <= PHY.CORNER; d++){
          for (const sg of [1, -1]){
            if (!blocked(w, p.x + d*sg, ny) && !blocked(w, p.x + d*sg, p.y)){
              p.x += d*sg; p.y = ny; return 0;
            }
          }
        }
      }
      return s < 0 ? -1 : 1;
    }
    p.y = ny; rem -= 1;
  }
  return 0;
}

// — Peligros y objetos —
function spikeRect(t, tx, ty){
  const x = tx*TS, y = ty*TS;
  if (t === T_SP_U) return { x:x+2, y:y+6,  w:TS-4, h:TS-6 };
  if (t === T_SP_D) return { x:x+2, y:y,    w:TS-4, h:TS-6 };
  if (t === T_SP_L) return { x:x,   y:y+2,  w:TS-6, h:TS-4 };
  if (t === T_SP_R) return { x:x+6, y:y+2,  w:TS-6, h:TS-4 };
  return null;
}
function hurt(w){
  const p = w.p, L = w.L;
  const bx = p.x + 1, by = p.y + 1, bw = PW - 2, bh = PH - 2;
  const x0 = Math.floor(bx/TS), x1 = Math.floor((bx+bw)/TS);
  const y0 = Math.floor(by/TS), y1 = Math.floor((by+bh)/TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++){
    const t = tileAt(L, tx, ty);
    if (t < T_SP_U || t > T_SP_R) continue;
    const r = spikeRect(t, tx, ty);
    if (bx < r.x + r.w && bx + bw > r.x && by < r.y + r.h && by + bh > r.y) return true;
  }
  const tt = w.t*DT;
  for (const s of L.saws){
    const q = sawPos(s, tt);
    const cx = Math.max(bx, Math.min(q.x, bx+bw)), cy = Math.max(by, Math.min(q.y, by+bh));
    if ((q.x-cx)**2 + (q.y-cy)**2 < s.r*s.r) return true;
  }
  return false;
}
function killPlayer(w){
  if (w.p.dead) return;
  w.p.dead = 1; w.deaths++; w.shake = 9; w.events.push('die');
}

function stepWorld(w, inp){
  w.events.length = 0;
  const p = w.p, L = w.L, tt = w.t*DT;
  const jumpP = inp.jump && !w.prev.jump, dashP = inp.dash && !w.prev.dash;
  w.prev.jump = !!inp.jump; w.prev.dash = !!inp.dash;
  w.t++;
  if (p.win){ p.win++; return; }
  if (p.dead){ p.dead++; if (p.dead > PHY.DEATH_F) resetAttempt(w); return; }
  if (jumpP) p.buf = PHY.BUFFER;
  // El cronómetro arranca con el primer movimiento, no al aparecer: podés
  // mirar la sala, leer el ritmo de una sierra y arrancar cuando quieras.
  // Una vez que te moviste, corre hasta la meta (morir reinicia la vuelta).
  if (!w.started && (inp.x || inp.y || inp.jump || inp.dash)) w.started = true;
  if (w.freeze > 0){ w.freeze--; if (w.started) w.timer++; return; }
  if (w.started) w.timer++;
  p.anim++;

  // ── Plataformas móviles: primero se mueven ellas y te arrastran ──
  for (const m of L.movers){
    const a = moverRect(m, tt), b = moverRect(m, tt + DT);
    const dx = b.x - a.x, dy = b.y - a.y;
    const rideX = p.x < a.x + a.w && p.x + PW > a.x;
    const onTop = rideX && Math.abs((p.y + PH) - a.y) < 2;
    if (onTop){ moveX(w, dx); moveY(w, dy); }
    else {
      // Si te alcanza, te empuja (nunca te incrusta en la pared: si no
      // hay lugar, morís aplastado — que se vea, no que se trabe).
      if (p.x < b.x + b.w && p.x + PW > b.x && p.y < b.y + b.h && p.y + PH > b.y){
        if (dx) { if (moveX(w, dx > 0 ? Math.ceil(dx + (b.x + b.w - p.x)) : Math.floor(dx - (p.x + PW - b.x)))) killPlayer(w); }
        if (dy) { if (moveY(w, dy > 0 ? Math.ceil(dy + (b.y + b.h - p.y)) : Math.floor(dy - (p.y + PH - b.y)))) killPlayer(w); }
        if (p.dead) return;
      }
    }
  }

  // ── Temporizadores ──
  if (p.buf > 0) p.buf--;
  if (p.lock > 0) p.lock--;
  if (p.grounded) p.coyote = PHY.COYOTE; else if (p.coyote > 0) p.coyote--;
  if (p.wall)   { p.wcoyote = PHY.WALL_COYOTE; p.wcdir = p.wall; } else if (p.wcoyote > 0) p.wcoyote--;
  for (let i = 0; i < w.cryT.length; i++) if (w.cryT[i] > 0) w.cryT[i]--;
  for (let i = 0; i < w.crSt.length; i++){
    if (w.crSt[i] === 1 && ++w.crT[i] >= PHY.CRUMB_F){ w.crSt[i] = 2; w.crT[i] = 0; w.events.push('crumble'); }
    else if (w.crSt[i] === 2 && ++w.crT[i] >= PHY.CRUMB_BACK){
      // Vuelve solo si no te deja adentro (si no, te incrustaría en el bloque).
      const idx = L.crumbs[i], tx = idx % L.w, ty = (idx - tx)/L.w;
      const dentro = p.x < tx*TS+TS && p.x+PW > tx*TS && p.y < ty*TS+TS && p.y+PH > ty*TS;
      if (!dentro){ w.crSt[i] = 0; w.crT[i] = 0; }
    }
  }

  const dashing = p.dash > 0;

  // ── Horizontal ──
  if (!dashing){
    const want = p.lock > 0 ? 0 : inp.x * PHY.RUN;
    const same = Math.sign(inp.x) === Math.sign(p.vx);
    let a;
    if (p.lock > 0) a = 0;
    else if (inp.x === 0) a = (p.grounded ? PHY.DEC_G : PHY.DEC_A);
    else a = (same || p.vx === 0) ? (p.grounded ? PHY.ACC_G : PHY.ACC_A)
                                  : (p.grounded ? PHY.DEC_G : PHY.DEC_A) * 1.4;
    if (a > 0){
      if (p.vx < want) p.vx = Math.min(want, p.vx + a*DT);
      else if (p.vx > want) p.vx = Math.max(want, p.vx - a*DT);
    }
    if (inp.x) p.face = inp.x;
  }

  // ── Gravedad (más suave en el pico: control fino sin volverse flotante) ──
  // Todo lo vertical se mide CONTRA w.grav, no contra "abajo": con la
  // gravedad dada vuelta, el techo es el piso y el salto va para abajo.
  // p.vy*gv > 0 significa "cayendo"; p.vy*gv < 0, "subiendo".
  const gv = w.grav;
  if (!dashing){
    const g = Math.abs(p.vy) < PHY.APEX && !p.grounded ? PHY.GRAV_APEX : PHY.GRAV;
    p.vy += g*DT*gv;
    if (p.vy*gv > PHY.MAX_FALL) p.vy = PHY.MAX_FALL*gv;
    if (p.vy*gv > 0 && p.wall && L.ab.wall && Math.sign(inp.x) === p.wall)
      p.vy = Math.min(p.vy*gv, PHY.WALL_SLIDE) * gv;
    if (p.vy*gv < 0 && !inp.jump) p.vy *= PHY.JUMP_CUT;            // salto de altura variable
  }

  // ── Salto y salto de pared ──
  if (p.buf > 0 && !dashing){
    if (p.coyote > 0){
      p.vy = -PHY.JUMP*gv; p.buf = 0; p.coyote = 0; p.grounded = false;
      p.sqx = .78; p.sqy = 1.25; w.events.push('jump');
    } else if (p.wcoyote > 0 && L.ab.wall){
      const d = p.wcdir;
      p.vy = -PHY.WJ_Y*gv; p.vx = -d * PHY.WJ_X; p.face = -d;
      p.buf = 0; p.wcoyote = 0; p.lock = PHY.WJ_LOCK; p.wall = 0;
      p.sqx = .8; p.sqy = 1.2; w.events.push('walljump');
    }
  }

  // ── Dash ──
  if (dashP && p.dashAvail && !dashing && L.ab.dash){
    let dx = inp.x, dy = inp.y;
    if (!dx && !dy) dx = p.face;
    const m = Math.hypot(dx, dy);
    p.dashDx = dx/m; p.dashDy = dy/m;
    p.vx = p.dashDx * PHY.DASH; p.vy = p.dashDy * PHY.DASH;
    p.dash = PHY.DASH_F; p.dashAvail = false; p.lock = 0;
    w.freeze = PHY.DASH_FREEZE; w.shake = 5;
    w.events.push('dash');
    return;                       // el hitstop empieza ya: se siente el golpe
  }
  if (p.dash > 0){
    p.vx = p.dashDx * PHY.DASH; p.vy = p.dashDy * PHY.DASH;
    if (--p.dash === 0){ p.vx *= PHY.DASH_END; p.vy *= (p.dashDy*w.grav < 0 ? .45 : PHY.DASH_END); }
  }

  // ── Movimiento y colisión ──
  const hitX = moveX(w, p.vx*DT);
  if (hitX) p.vx = 0;
  const hitY = moveY(w, p.vy*DT);
  const wasG = p.grounded;
  if (hitY === gv){                       // chocaste del lado al que tira la gravedad: es piso
    const caida = p.vy*gv;
    if (caida > 220) { w.shake = Math.max(w.shake, 3); }
    if (!wasG && caida > 60) w.events.push('land');
    p.sqy = Math.max(.72, 1 - caida/1600); p.sqx = 2 - p.sqy;
    p.vy = 0; p.grounded = true; p.dash = 0;
  } else if (hitY === -gv){               // te golpeaste contra el "techo"
    p.vy = p.vy*gv < 0 ? 0 : p.vy; p.grounded = false;
  }
  else p.grounded = false;
  if (!p.grounded) p.grounded = blocked(w, p.x, p.y + gv) || !!moverAt(w, p.x, p.y + gv) ||
                                onewayHit(w, p.x, p.y + gv, p.y, gv) >= 0;
  if (p.grounded){ p.dashAvail = true; p.dash = 0; }

  // ── Pared (solo cuenta si apretás contra ella) ──
  p.wall = 0;
  if (!p.grounded && L.ab.wall){
    if (blocked(w, p.x - 1, p.y) && inp.x < 0) p.wall = -1;
    else if (blocked(w, p.x + 1, p.y) && inp.x > 0) p.wall = 1;
  }

  // ── Resortes ──
  for (const s of L.springs){
    const rx = s.tx*TS, ry = s.ty*TS;
    // Se pisa por la cara que mira a la gravedad, y dispara para el otro lado.
    const pies = gv > 0 ? p.y + PH : p.y, cara = gv > 0 ? ry : ry + TS;
    if (p.x < rx + TS && p.x + PW > rx && Math.abs(pies - cara) < 3 && p.vy*gv >= 0){
      p.vy = -PHY.SPRING*gv; p.grounded = false; p.dashAvail = true; p.coyote = 0;
      p.sqx = .7; p.sqy = 1.35; w.events.push('spring');
    }
  }
  // ── Bloques frágiles: se marcan al pisarlos ──
  for (let i = 0; i < L.crumbs.length; i++){
    if (w.crSt[i] !== 0) continue;
    const idx = L.crumbs[i], tx = idx % L.w, ty = (idx - tx)/L.w;
    const rx = tx*TS, ry = ty*TS;
    const pies = gv > 0 ? p.y + PH : p.y, cara = gv > 0 ? ry : ry + TS;
    const touch = p.x < rx + TS && p.x + PW > rx &&
      ((Math.abs(pies - cara) < 2 && p.vy*gv >= 0) || (p.y < ry + TS && p.y + PH > ry && p.wall));
    if (touch){ w.crSt[i] = 1; w.crT[i] = 0; w.events.push('crack'); }
  }
  // ── Cristales de dash ──
  for (let i = 0; i < L.crystals.length; i++){
    if (w.cryT[i] > 0) continue;
    const c = L.crystals[i], rx = c.tx*TS + 1, ry = c.ty*TS + 1;
    if (p.x < rx + TS-2 && p.x + PW > rx && p.y < ry + TS-2 && p.y + PH > ry){
      if (!p.dashAvail || p.dash > 0){
        p.dashAvail = true; w.cryT[i] = PHY.CRYSTAL_BACK; w.events.push('crystal');
      }
    }
  }
  // ── Baldosas de gravedad ──
  // Fijan la gravedad (no la alternan): tocar dos veces la misma baldosa no
  // hace nada, así el nivel se puede leer sin memorizar por dónde pasaste.
  if (L.ab.grav){
    const bx = p.x + 1, by = p.y + 1;
    const x0 = Math.floor(bx/TS), x1 = Math.floor((bx + PW - 2)/TS);
    const y0 = Math.floor(by/TS), y1 = Math.floor((by + PH - 2)/TS);
    for (let ty = y0; ty <= y1 && !p.dead; ty++) for (let tx = x0; tx <= x1; tx++){
      const t = tileAt(L, tx, ty);
      if (t !== T_PAD_D && t !== T_PAD_U) continue;
      const nueva = t === T_PAD_U ? -1 : 1;
      if (w.grav === nueva) continue;
      w.grav = nueva;
      p.coyote = 0; p.grounded = false; p.wall = 0; p.wcoyote = 0;
      if (p.vy*nueva < 0) p.vy = 0;    // no arrastres el impulso contra la nueva caída
      w.shake = Math.max(w.shake, 5);
      w.events.push('flip');
    }
  }

  // ── Estrella ──
  for (let i = 0; i < L.stars.length; i++){
    if (w.starGot[i]) continue;
    const s = L.stars[i], rx = s.tx*TS, ry = s.ty*TS;
    if (p.x < rx + TS && p.x + PW > rx && p.y < ry + TS && p.y + PH > ry){
      w.starGot[i] = 1; w.events.push('star');
    }
  }

  // ── Muerte / meta ──
  if (hurt(w)){ killPlayer(w); return; }
  const g = L.goal;
  if (p.x < g.x + TS - 1 && p.x + PW > g.x + 1 && p.y < g.y + TS && p.y + PH > g.y + 1){
    p.win = 1; w.events.push('goal');
  }
  if (p.sqx !== 1 || p.sqy !== 1){
    p.sqx += (1 - p.sqx)*.22; p.sqy += (1 - p.sqy)*.22;
    if (Math.abs(1 - p.sqx) < .01){ p.sqx = 1; p.sqy = 1; }
  }
}

// ===== js/fx.js =====
// Partículas y sacudida: puro adorno, fuera de la física (usan Math.random,
// así que NUNCA pueden influir en el juego — si lo hicieran, se rompería la
// repetibilidad, que es lo único que hace justa a una plataforma de precisión).
const FX = { p:[], shake:0, flash:0 };
function fxBurst(x, y, n, col, spd, grav){
  for (let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2, v = spd*(.35 + Math.random()*.9);
    FX.p.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, g:(grav == null ? 420 : grav) * GV(),
      life:1, dec:1.6 + Math.random()*1.6, col, s:1.4 + Math.random()*2.2 });
  }
}
function fxDust(x, y, dir){
  const gv = GV();
  for (let i = 0; i < 6; i++)
    FX.p.push({ x:x + (Math.random()-.5)*8, y, vx:(dir || (Math.random()-.5))*(20+Math.random()*70),
      vy:-Math.random()*60*gv, g:260*gv, life:1, dec:3.2, col:'#8fa3c9', s:1.2 + Math.random()*1.6 });
}
const GV = () => (GAME.w ? GAME.w.grav : 1);
function fxStep(dt){
  for (let i = FX.p.length - 1; i >= 0; i--){
    const q = FX.p[i];
    q.vy += q.g*dt; q.x += q.vx*dt; q.y += q.vy*dt; q.life -= q.dec*dt;
    if (q.life <= 0) FX.p.splice(i, 1);
  }
  FX.shake = Math.max(0, FX.shake - dt*30);
  FX.flash = Math.max(0, FX.flash - dt*4);
}

// ===== js/render.js =====
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const VIEW = { s:1, ox:0, oy:0, dpr:1 };

function layout(){
  const st = document.getElementById('stage');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const portrait = window.innerHeight > window.innerWidth * 1.05;
  document.body.classList.toggle('portrait', portrait);
  document.body.classList.toggle('landscape', !portrait);
  // En vertical el juego NO se centra en la pantalla: se apoya bajo el HUD y
  // todo lo que sobra es para los dedos. Centrarlo dejaba media pantalla negra
  // arriba y los botones lejos del pulgar.
  const hudH = 54;
  const salaH = Math.round(window.innerWidth * VIEW_H / VIEW_W);
  const ctrl = portrait ? Math.max(150, window.innerHeight - salaH - hudH) : 0;
  document.documentElement.style.setProperty('--ctrl', ctrl + 'px');
  document.documentElement.style.setProperty('--hud-h', hudH + 'px');
  document.documentElement.style.setProperty('--sala-h', (portrait ? salaH : 0) + 'px');
  if (STICK.id < 0) stickHome();
  const r = st.getBoundingClientRect();     // medir DESPUÉS de aplicar las variables
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
  VIEW.dpr = dpr;
  VIEW.s = Math.min(w / VIEW_W, h / VIEW_H);
  VIEW.ox = (w - VIEW_W*VIEW.s) / 2;
  VIEW.oy = (h - VIEW_H*VIEW.s) / 2;
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 120));

function rr(x, y, w, h, r){
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}
function drawBG(gv){
  gv = gv || 1;
  // El degradé apunta siempre "hacia el piso": con la gravedad invertida se
  // da vuelta solo. Es la pista de fondo de que estás caminando por el techo.
  const g = ctx.createLinearGradient(0, gv > 0 ? 0 : VIEW_H, 0, gv > 0 ? VIEW_H : 0);
  g.addColorStop(0, COL.bg2); g.addColorStop(1, COL.bg);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  if (gv < 0){
    const f = ctx.createLinearGradient(0, 0, 0, 26);
    f.addColorStop(0, COL.pad + '33'); f.addColorStop(1, COL.pad + '00');
    ctx.fillStyle = f; ctx.fillRect(0, 0, VIEW_W, 26);
  }
  // Textura de puntos: da referencia de distancia sin competir con el terreno
  // (una grilla de líneas ensucia y hace que las paredes no se lean).
  ctx.fillStyle = COL.grid;
  for (let y = TS; y < VIEW_H; y += TS*2) for (let x = TS; x < VIEW_W; x += TS*2)
    ctx.fillRect(x - 1, y - 1, 2, 2);
}
function solidLike(L, tx, ty){
  const t = tileAt(L, tx, ty);
  return t === T_SOLID || t === T_SPRING;
}
function drawTiles(w){
  const L = w.L;
  for (let ty = 0; ty < L.h; ty++) for (let tx = 0; tx < L.w; tx++){
    const t = L.tiles[ty*L.w + tx], x = tx*TS, y = ty*TS;
    if (t === T_SOLID){
      ctx.fillStyle = COL.solid; ctx.fillRect(x, y, TS, TS);
      // Borde iluminado en las caras expuestas: es lo que hace que se lea
      // dónde termina el piso y dónde empieza el aire (en un juego de
      // precisión, dudar del borde ya es haber perdido).
      const up = solidLike(L, tx, ty-1), dn = solidLike(L, tx, ty+1);
      const lf = solidLike(L, tx-1, ty), rt = solidLike(L, tx+1, ty);
      ctx.fillStyle = COL.solidTop;
      if (!up) ctx.fillRect(x, y, TS, 2);
      if (!lf) ctx.fillRect(x, y, 2, TS);
      if (!rt) ctx.fillRect(x + TS - 2, y, 2, TS);
      if (!dn){ ctx.fillStyle = COL.solidEdge; ctx.fillRect(x, y + TS - 2, TS, 2); }
      ctx.fillStyle = '#ffffff08';
      if (!up) ctx.fillRect(x + 2, y + 2, TS - 4, 1);
    } else if (t >= T_SP_U && t <= T_SP_R){
      ctx.fillStyle = COL.spike;
      const n = 3, s = TS/n;
      for (let i = 0; i < n; i++){
        ctx.beginPath();
        if (t === T_SP_U){ ctx.moveTo(x+i*s, y+TS); ctx.lineTo(x+i*s+s/2, y+3); ctx.lineTo(x+i*s+s, y+TS); }
        if (t === T_SP_D){ ctx.moveTo(x+i*s, y); ctx.lineTo(x+i*s+s/2, y+TS-3); ctx.lineTo(x+i*s+s, y); }
        if (t === T_SP_L){ ctx.moveTo(x+TS, y+i*s); ctx.lineTo(x+3, y+i*s+s/2); ctx.lineTo(x+TS, y+i*s+s); }
        if (t === T_SP_R){ ctx.moveTo(x, y+i*s); ctx.lineTo(x+TS-3, y+i*s+s/2); ctx.lineTo(x, y+i*s+s); }
        ctx.fill();
      }
    } else if (t === T_ONEWAY){
      ctx.fillStyle = COL.oneway; ctx.fillRect(x, y, TS, 3);
      ctx.fillStyle = COL.oneway + '55'; ctx.fillRect(x + 2, y + 3, TS - 4, 2);
    } else if (t === T_PAD_D || t === T_PAD_U){
      const dir = t === T_PAD_U ? -1 : 1;
      const pulso = .55 + Math.sin(w.t*.07 + tx)*.18;
      ctx.globalAlpha = pulso;
      ctx.fillStyle = COL.pad;
      ctx.fillRect(x + 1, y + (dir > 0 ? TS - 3 : 1), TS - 2, 2);
      ctx.beginPath();
      ctx.moveTo(x + TS/2, y + (dir > 0 ? TS - 4 : 4));
      ctx.lineTo(x + TS/2 - 4, y + (dir > 0 ? TS - 10 : 10));
      ctx.lineTo(x + TS/2 + 4, y + (dir > 0 ? TS - 10 : 10));
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = COL.pad + '44'; ctx.lineWidth = 1;
      ctx.strokeRect(x + .5, y + .5, TS - 1, TS - 1);
    } else if (t === T_SPRING){
      ctx.fillStyle = COL.solid; ctx.fillRect(x, y + 6, TS, TS - 6);
      ctx.fillStyle = COL.spring; ctx.fillRect(x + 1, y + 2, TS - 2, 5);
      ctx.fillStyle = '#ffd9a8'; ctx.fillRect(x + 1, y + 2, TS - 2, 2);
      ctx.strokeStyle = COL.spring + '99'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x+3, y+9); ctx.lineTo(x+TS-3, y+12); ctx.stroke();
    }
  }
  // Bloques frágiles
  for (let i = 0; i < L.crumbs.length; i++){
    const idx = L.crumbs[i], tx = idx % L.w, ty = (idx - tx)/L.w;
    const st = w.crSt[i]; if (st === 2) continue;
    const sh = st === 1 ? (Math.random()-.5)*1.6 : 0;
    const x = tx*TS + sh, y = ty*TS + sh;
    ctx.fillStyle = st === 1 ? '#a37b4a' : COL.crumb;
    ctx.fillRect(x, y, TS, TS);
    ctx.strokeStyle = '#00000055'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x+3, y+2); ctx.lineTo(x+7, y+8); ctx.lineTo(x+4, y+TS-2);
    ctx.moveTo(x+TS-3, y+4); ctx.lineTo(x+10, y+9); ctx.stroke();
  }
  // Cristales de dash
  for (let i = 0; i < L.crystals.length; i++){
    const c = L.crystals[i], x = c.tx*TS + TS/2, y = c.ty*TS + TS/2;
    const on = w.cryT[i] === 0;
    const p = Math.sin(w.t*.08 + i)*1.5;
    ctx.save(); ctx.translate(x, y + p); ctx.rotate(w.t*.02);
    ctx.fillStyle = on ? COL.crystal : '#ffffff18';
    ctx.beginPath(); ctx.moveTo(0,-7); ctx.lineTo(5,0); ctx.lineTo(0,7); ctx.lineTo(-5,0); ctx.closePath(); ctx.fill();
    if (on){ ctx.fillStyle = '#ffffffcc'; ctx.beginPath(); ctx.moveTo(0,-3); ctx.lineTo(2,0); ctx.lineTo(0,3); ctx.lineTo(-2,0); ctx.fill(); }
    ctx.restore();
  }
  // Estrellas
  for (let i = 0; i < L.stars.length; i++){
    if (w.starGot[i]) continue;
    const s = L.stars[i], x = s.tx*TS + TS/2, y = s.ty*TS + TS/2 + Math.sin(w.t*.06 + i)*2;
    ctx.save(); ctx.translate(x, y); ctx.rotate(w.t*.015); ctx.fillStyle = COL.star;
    ctx.beginPath();
    for (let k = 0; k < 8; k++){
      const a = k*Math.PI/4, r = k % 2 ? 2.6 : 7;
      k ? ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  // Móviles y sierras
  const tt = w.t*DT;
  for (const m of L.movers){
    const r = moverRect(m, tt);
    ctx.fillStyle = COL.mover; rr(r.x, r.y, r.w, r.h, 3); ctx.fill();
    ctx.fillStyle = '#ffffff44'; ctx.fillRect(r.x + 2, r.y + 2, r.w - 4, 2);
  }
  for (const s of L.saws){
    const q = sawPos(s, tt);
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(w.t*.25);
    ctx.fillStyle = COL.saw;
    ctx.beginPath();
    for (let k = 0; k < 12; k++){
      const a = k*Math.PI/6, r = k % 2 ? s.r*.62 : s.r;
      k ? ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2a0d10'; ctx.beginPath(); ctx.arc(0, 0, s.r*.28, 0, 7); ctx.fill();
    ctx.restore();
  }
  // Meta
  const g = L.goal, pu = 1 + Math.sin(w.t*.09)*.12;
  ctx.save(); ctx.translate(g.x + TS/2, g.y + TS/2); ctx.scale(pu, pu);
  ctx.fillStyle = COL.goal + '33'; ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.fill();
  ctx.fillStyle = COL.goal;
  ctx.fillRect(-1, -8, 2, 16);
  ctx.beginPath(); ctx.moveTo(1, -8); ctx.lineTo(9, -4.5); ctx.lineTo(1, -1); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawPlayer(p, alpha, col, gv){
  const cx = p.x + PW/2, cy = p.y + PH/2;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx, cy); ctx.scale(p.sqx || 1, (p.sqy || 1) * (gv || 1));
  ctx.fillStyle = col;
  rr(-PW/2, -PH/2, PW, PH, 3); ctx.fill();
  ctx.fillStyle = '#00000088';
  const fx = (p.face || 1) * 2;
  ctx.fillRect(fx - 3, -3, 2, 3); ctx.fillRect(fx + 1, -3, 2, 3);
  ctx.restore();
}
function drawWorld(w){
  ctx.save();
  ctx.setTransform(VIEW.s, 0, 0, VIEW.s, VIEW.ox, VIEW.oy);
  const sh = OPTS.shake ? FX.shake : 0;
  if (sh) ctx.translate((Math.random()-.5)*sh, (Math.random()-.5)*sh);
  ctx.beginPath(); ctx.rect(0, 0, VIEW_W, VIEW_H); ctx.clip();
  drawBG(w.grav);
  drawTiles(w);
  // Fantasma del récord
  if (OPTS.ghost && GAME.ghost && GAME.mode === 'play' && w.timer > 0){
    const f = GAME.ghost, i = Math.min(w.timer - 1, f.n - 1);
    if (i >= 0 && f.n){
      const gx = f.d[i*3]/2, gy = f.d[i*3+1]/2, fl = f.d[i*3+2];
      drawPlayer({ x:gx, y:gy, face:(fl & 1) ? 1 : -1, sqx:1, sqy:1 }, .22, COL.ghost,
        (fl & 2) ? -1 : 1);
    }
  }
  // Partículas
  for (const q of FX.p){
    ctx.globalAlpha = Math.max(0, Math.min(1, q.life));
    ctx.fillStyle = q.col;
    ctx.fillRect(q.x - q.s/2, q.y - q.s/2, q.s, q.s);
  }
  ctx.globalAlpha = 1;
  // Jugador
  const p = w.p;
  if (!p.dead){
    if (p.dash > 0){
      for (let k = 1; k <= 3; k++)
        drawPlayer({ x:p.x - p.dashDx*k*5, y:p.y - p.dashDy*k*5, face:p.face, sqx:1, sqy:1 },
          .18*(4-k), COL.crystal, w.grav);
    }
    drawPlayer(p, p.win ? Math.max(0, 1 - p.win/30) : 1, p.dashAvail ? COL.player : COL.playerNo,
      w.grav);
  }
  // Cartel de ayuda del nivel
  if (OPTS.hints && GAME.hintT > 0 && GAME.mode === 'play'){
    ctx.globalAlpha = Math.min(1, GAME.hintT/60);
    ctx.font = '9px ui-monospace, monospace'; ctx.textAlign = 'center';
    const tw = ctx.measureText(w.L.hint).width + 12, ty = VIEW_H - 22;
    ctx.fillStyle = '#050810dd';
    rr(VIEW_W/2 - tw/2, ty - 8, tw, 14, 4); ctx.fill();
    ctx.fillStyle = '#e7ecf7';
    ctx.fillText(w.L.hint, VIEW_W/2, ty + 2);
    ctx.globalAlpha = 1;
  }
  if (FX.flash > 0){
    ctx.fillStyle = '#ffffff'; ctx.globalAlpha = Math.min(.5, FX.flash*.5);
    ctx.fillRect(0, 0, VIEW_W, VIEW_H); ctx.globalAlpha = 1;
  }
  ctx.restore();
  // Marco fuera del área jugable
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = COL.out;
  if (VIEW.oy > 0){ ctx.fillRect(0, 0, cv.width, VIEW.oy); ctx.fillRect(0, cv.height - VIEW.oy - 1, cv.width, VIEW.oy + 1); }
  if (VIEW.ox > 0){ ctx.fillRect(0, 0, VIEW.ox, cv.height); ctx.fillRect(cv.width - VIEW.ox - 1, 0, VIEW.ox + 1, cv.height); }
  ctx.restore();
}

// ===== js/ghost.js =====
// El fantasma es la mejor herramienta para SENTIR que mejoraste: corrés
// contra vos mismo. Se guarda la mejor vuelta cuadro por cuadro (x, y y
// hacia dónde mirabas), cuantizada a medio píxel para que entre en
// localStorage sin comerse el espacio.
function ghostLoad(idx){
  try {
    const raw = JSON.parse(lsGet(ghostKey(idx)) || 'null');
    if (!raw || !Array.isArray(raw.d) || raw.d.length < 3) return null;
    return { n: Math.floor(raw.d.length/3), d: raw.d };
  } catch(_){ return null; }
}
function ghostSave(idx, rec){
  if (!rec || rec.length < 3) return;
  const cap = 60*90*3;                        // 90 s como máximo
  const d = rec.length > cap ? rec.slice(0, cap) : rec;
  lsSet(ghostKey(idx), JSON.stringify({ v:1, d }));
}
// Bit 0 = hacia dónde mira · bit 1 = gravedad invertida. Los fantasmas
// viejos (solo 0/1) siguen leyéndose: bit 1 apagado = gravedad normal.
function ghostRecord(rec, p, gv){
  rec.push(Math.round(p.x*2), Math.round(p.y*2), (p.face > 0 ? 1 : 0) | (gv < 0 ? 2 : 0));
}

//
// Sin cuentas: cada aparato genera un uuid la primera vez y firma con el
// nombre que elijas. Un juego que corre entero en el navegador no puede
// demostrar que un tiempo sea real, así que la tabla no pretende ser
// antitrampa; lo único que el servidor garantiza (con la función
// `enviar_record`) es que nadie pueda pisarle el récord a otro.
const NET = {

  key:'sb_publishable_44vkb62Bky3ZVtb0RiolyQ_hMAuABmo',
  name:'', aparato:'', tabla:[], viendo:null, ws:null, hb:0, poll:0, estado:'',

function netOn(){ return !!(NET.url && NET.key); }
function netInit(){

function pedirNombre(){

    NET.name || '');
  if (v == null) return;
