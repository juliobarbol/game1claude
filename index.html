async function rpc(fn, body){
  if (!netOn() || !NET.name) return null;
  try {
    const r = await fetch(NET.url + '/rest/v1/rpc/' + fn, {
      method:'POST',
      headers:{ 'apikey':NET.key, 'Authorization':'Bearer ' + NET.key, 'Content-Type':'application/json' },
      body: JSON.stringify(body),
    });
    return r.ok ? true : null;
  } catch(_){ return null; }
}
// `clave`: 'n6' = nivel 7 · 'w2' = mundo 3 · 'todo' = el juego entero.
function subirRecord(clave, frames, muertes){
  if (!netOn() || !NET.name || !frames) return;
  rpc('enviar_record', { p_jugador:NET.name, p_aparato:NET.aparato, p_clave:clave,
    p_espejo:!!OPTS.mirror, p_frames:Math.floor(frames), p_muertes:Math.floor(muertes || 0) });
}
// Se llama al hacer un récord: manda SOLO el que cambió. El envío masivo es
// `sincronizarTodo`, y ese corre una sola vez, cuando ponés (o cambiás) el nombre.
function subirRecords(){
  if (!netOn() || !NET.name) return;
  const R = GAME.run;
  if (R) return;                       // dentro de un maratón se sube al final
  const r = lvRec(GAME.idx);
  if (r.best) subirRecord('n' + GAME.idx, r.best, r.deaths);
}
async function sincronizarTodo(){
  if (!netOn() || !NET.name) return;
  const pend = [];
  for (const esp of ['', 'm']){
    for (let i = 0; i < LEVELS.length; i++){
      const r = SAVE.lv[String(i) + esp];
      if (r && r.best) pend.push({ clave:'n' + i, esp, frames:r.best, muertes:r.deaths });
    }
    // Los cuatro casilleros de recorrido: normal/espejo × normal/extremo.
    for (const d of runDefs()) for (const ext of ['', 'x']){
      const r = SAVE.run[d.k + esp + ext];
      if (r && r.best) pend.push({ clave:d.k + ext, esp, frames:r.best, muertes:r.deaths });
    }
  }
  for (const p of pend){
    await rpc('enviar_record', { p_jugador:NET.name, p_aparato:NET.aparato, p_clave:p.clave,
      p_espejo:p.esp === 'm', p_frames:p.frames, p_muertes:p.muertes });
  }
  if (pend.length) toast(pend.length + ' récords subidos');
}
async function traerTabla(clave, espejo){
  if (!netOn()) return null;
  const q = '/rest/v1/records?select=jugador,frames,muertes,creado' +
    '&clave=eq.' + encodeURIComponent(clave) + '&espejo=is.' + (espejo ? 'true' : 'false') +
    '&order=frames.asc&limit=25';
  try {
    const r = await fetch(NET.url + q, { headers:{ 'apikey':NET.key, 'Authorization':'Bearer ' + NET.key } });
    if (!r.ok) return null;
    return await r.json();
  } catch(_){ return null; }
}
// — En vivo —
// Realtime de Supabase hablado a mano (no hay build, así que no hay librería).
// Si el socket no levanta, se cae a recargar cada 6 s: para el jugador es lo
// mismo, y no queda una pantalla mintiendo que está al día.
function netEscuchar(){
  netCallar();
  NET.poll = setInterval(() => { if (NET.viendo) refrescarTabla(true); }, 6000);
  if (!netOn() || !self.WebSocket) return;
  try {
    const ws = new WebSocket(NET.url.replace(/^http/, 'ws') +
      '/realtime/v1/websocket?apikey=' + encodeURIComponent(NET.key) + '&vsn=1.0.0');
    NET.ws = ws;
    ws.onopen = () => {
      ws.send(JSON.stringify({ topic:'realtime:filo', event:'phx_join', ref:'1',
        payload:{ config:{ postgres_changes:[{ event:'*', schema:'public', table:'records' }] } } }));
      NET.hb = setInterval(() => {
        try { ws.send(JSON.stringify({ topic:'phoenix', event:'heartbeat', payload:{}, ref:'hb' })); }
        catch(_){}
      }, 25000);
    };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch(_){ return; }
      if (m && m.event === 'postgres_changes' && NET.viendo) refrescarTabla(true);
    };
    ws.onerror = () => {};
    ws.onclose = () => { clearInterval(NET.hb); if (NET.ws === ws) NET.ws = null; };
  } catch(_){}
}
function netCallar(){
  clearInterval(NET.poll); clearInterval(NET.hb);
  if (NET.ws){ try { NET.ws.close(); } catch(_){} NET.ws = null; }
}

// ===== js/game.js =====
let optsFrom = 'menu';
const GAME = { mode:'menu', w:null, idx:0, ghost:null, rec:[], acc:0, last:0, hintT:0,
  deaths:0, wonAt:0, lastResult:null, run:null, lastRun:null };

function startLevel(i, keepDeaths){
  // Momento de desbloqueo: la primera vez que entrás a un mundo nuevo, el
  // juego se detiene un segundo a decirte qué aprendiste. Es la mitad de la
  // sensación de progreso; la otra mitad es que el nivel lo pida enseguida.
  // En un maratón no: ahí el reloj corre y frenar sería robarte tiempo.
  const ab = GAME.run ? null : ABIL.find(a => a.at === i);
  if (ab && !lvRec(i).best && !GAME._abShown){
    GAME._abShown = i;
    $('abTag').textContent = ab.tag || 'NUEVA HABILIDAD';
    $('abTitle').textContent = ab.t;
    $('abDesc').textContent = ab.d;
    $('abGo').textContent = ab.btn || 'A PROBARLA';
    GAME.idx = i; GAME.mode = 'menu';
    showScreen('abil');
    return;
  }
  GAME._abShown = 0;
  GAME.idx = i;
  GAME.w = newWorld(i);
  GAME.ghost = OPTS.ghost ? ghostLoad(i) : null;
  GAME.rec = [];
  GAME.deaths = keepDeaths ? GAME.deaths : 0;
  GAME.hintT = LEVELS[i].hint ? 260 : 0;
  document.getElementById('btnDash').classList.toggle('hidden', !LEVELS[i].dash);
  GAME.mode = 'play';
  GAME.acc = 0; GAME.last = performance.now();
  FX.p.length = 0; FX.shake = 0;
  showScreen(null);
  document.getElementById('hud').classList.remove('hidden');
  hudUpdate();
}
function retryLevel(){
  if (!GAME.w) return;
  if (GAME.mode === 'pause') showScreen(null);
  GAME.mode = 'play';
  GAME.rec = [];
  const w = GAME.w;
  w.deaths++; contarMuerte();
  resetAttempt(w);
  FX.p.length = 0;
  document.getElementById('hud').classList.remove('hidden');
  hudUpdate();
}
function togglePause(){
  if (GAME.mode === 'play'){ GAME.mode = 'pause'; showScreen('pause'); }
  else if (GAME.mode === 'pause'){ GAME.mode = 'play'; GAME.last = performance.now(); showScreen(null); }
}
function quitToMenu(){
  saveSave();
  GAME.run = null;
  GAME.mode = 'menu'; GAME.w = null;
  document.getElementById('hud').classList.add('hidden');
  showScreen('levels'); renderLevels();
}

// ── Maratón ────────────────────────────────────────────────────────────
// Un mundo entero (o el juego completo) de un tirón, con un cronómetro solo.
// Es la idea del encadenado subida de escala: dominar un nivel suelto y
// aguantar cinco seguidos sin que se te caiga la mano son dos cosas
// distintas, y la segunda es la que se siente como haber mejorado.
//
// Diferencia importante con el cronómetro de nivel: el del maratón NO se
// reinicia cuando morís. Sigue sin haber vidas, ni esperas, ni cortes —
// reintentar es igual de instantáneo—, pero en un recorrido lo único que se
// mide es cuánto tardaste en llegar al final, y morir tarda.
function runDefs(){
  const l = WORLDS.filter(w => w.a < LEVELS.length)
    .map((w, i) => ({ k:'w' + i, n:w.n, a:w.a, b:Math.min(w.b, LEVELS.length) }));
  if (l.length > 1) l.push({ k:'todo', n:'EL JUEGO ENTERO', a:0, b:LEVELS.length });
  return l;
}
// Dos relojes distintos, y la diferencia es toda la gracia del extremo:
//
//   NORMAL  — suma el tiempo que estuviste JUGANDO. Arranca con tu primer
//             movimiento (igual que el de nivel), no corre entre nivel y
//             nivel, y la pausa lo frena. Podés mirar cada sala gratis.
//   EXTREMO — es un cronómetro de pared: arranca cuando aparece la primera
//             sala y para cuando tocás la última bandera. Cuenta todo: lo
//             que tardás en leer el nivel, el respiro entre uno y otro, y
//             la pausa. No hay nada gratis.
function startRun(def){
  const ext = !!OPTS.extremo;
  GAME.run = { k:runKey(def.k), n:def.n, a:def.a, b:def.b, def, extremo:ext,
    frames:0, on:false, splits:[], deaths:0, best:runRec(runKey(def.k)),
    flash:null, pb:[], t0:0, fin:0 };
  startLevel(def.a);
  if (ext) GAME.run.t0 = performance.now();     // desde que la sala está en pantalla
}
// El extremo no cuenta pasos de física: mide tiempo real. Se congela con
// `fin`, que se pone al tocar la última bandera (y no cuando termina la
// animación, que sería regalarte medio segundo).
function runTick(R){
  if (!R || !R.extremo || !R.t0) return;
  R.frames = Math.round(((R.fin || performance.now()) - R.t0) / 1000 * 60);
}
// Cierra el nivel que se acaba de terminar y devuelve la diferencia contra el
// parcial de tu mejor maratón (en frames), o null si todavía no hay con qué
// comparar. Los parciales son ACUMULADOS: comparar el tramo suelto premiaría
// un nivel bueno dentro de una vuelta mala.
function runSplit(){
  const R = GAME.run, k = R.splits.length;
  R.splits.push(R.frames);
  const ref = R.best && R.best.splits.length > k ? R.best.splits[k] : 0;
  return ref ? (R.frames - ref) : null;
}
function runAdvance(){
  const R = GAME.run, next = GAME.idx + 1;
  if (next >= R.b){ finishRun(); return; }
  const d = R.flash; R.flash = null;
  startLevel(next);
  splitFlash(R.splits[R.splits.length - 1], d);
}
function finishRun(){
  const R = GAME.run;
  const prev = R.best ? R.best.best : 0;
  const record = !prev || R.frames < prev;
  if (record) SAVE.run[R.k] = { best:R.frames, splits:R.splits.slice(), deaths:R.deaths };
  saveSave();
  GAME.lastRun = { def:R.def, n:R.n, frames:R.frames, prev, record, extremo:R.extremo,
    deaths:R.deaths, splits:R.splits.slice(), mejor:(SAVE.run[R.k] || null) };
  GAME.run = null;
  GAME.mode = 'menu'; GAME.w = null;
  document.getElementById('hud').classList.add('hidden');
  if (record) { SFX.star(); FX.flash = .6; subirRecord(claveNet(R.def.k), R.frames, R.deaths); }
  // Y recién ahora los récords de nivel que hayas hecho durante el recorrido.
  for (const i of R.pb){ const r = lvRec(i); if (r.best) subirRecord('n' + i, r.best, r.deaths); }
  showRunEnd();
}

function handleEvents(w){
  for (const e of w.events){
    const p = w.p, cx = p.x + PW/2, cy = p.y + PH/2;
    switch (e){
      case 'jump':     SFX.jump(); fxDust(cx, w.grav > 0 ? p.y + PH : p.y, 0); break;
      case 'walljump': SFX.wall(); fxBurst(cx + (p.face*-6), cy, 5, '#9fb4dd', 90); vibrate(8); break;
      case 'land':     SFX.land(); fxDust(cx, w.grav > 0 ? p.y + PH : p.y, 0); break;
      case 'dash':     SFX.dash(); fxBurst(cx, cy, 10, COL.crystal, 150, 60); FX.shake = 5; vibrate(12); break;
      case 'spring':   SFX.spring(); fxBurst(cx, p.y + PH, 10, COL.spring, 160, 200); vibrate(14); break;
      case 'crystal':  SFX.crystal(); fxBurst(cx, cy, 10, COL.crystal, 130, 0); break;
      case 'crack':    fxDust(cx, w.grav > 0 ? p.y + PH : p.y, 0); break;
      case 'flip':     SFX.flip(); fxBurst(cx, cy, 14, COL.pad, 150, 0); FX.shake = 6;
                       vibrate(16); break;
      case 'crumble':  fxBurst(cx, p.y + PH + 6, 8, COL.crumb, 90, 500); break;
      case 'star':     SFX.star(); fxBurst(cx, cy, 16, COL.star, 170, 40); FX.flash = .5; break;
      case 'die':      SFX.die(); fxBurst(cx, cy, 26, COL.player, 210, 380); FX.shake = 10;
                       vibrate(38); contarMuerte(); GAME.rec = []; break;
      case 'goal':     onWin(); break;
    }
  }
  if (w.shake){ FX.shake = Math.max(FX.shake, w.shake); w.shake = 0; }
}

// Una muerte se anota en el acto: es lo que destraba el nivel siguiente si
// un nivel se te hace cuesta arriba (ver `unlocked`), y no se pierde si
// cerrás el juego sin terminarlo.
function contarMuerte(){
  GAME.deaths++; SAVE.deaths++;
  if (GAME.run) GAME.run.deaths++;
  lvRec(GAME.idx).deaths++;
  saveSave();
}

function onWin(){
  const w = GAME.w, i = GAME.idx;
  const frames = w.timer, time = frames/60;
  const r = lvRec(i);
  const prev = r.best;
  const record = !prev || frames < prev;
  const star = w.starGot.length ? Array.from(w.starGot).every(v => v) : false;
  if (record) r.best = frames;
  if (star) r.star = true;
  if (GAME.deaths === 0) r.noDeath = true;
  SAVE.frames += frames; SAVE.wins++;
  saveSave();
  if (record) ghostSave(i, GAME.rec);
  // En un maratón el récord de nivel se anota igual, pero el envío queda
  // para el final: mientras el reloj corre no se toca la red.
  if (record){ if (GAME.run) GAME.run.pb.push(i); else subirRecords(); }
  GAME.lastResult = { i, frames, prev, record, star, deaths:GAME.deaths, medal:medalOf(i, frames) };
  // En un maratón la vuelta cuenta igual para el récord del nivel (arriba),
  // pero no hay pantalla de resultado: el parcial se cierra acá y el nivel
  // siguiente arranca solo desde el bucle.
  if (GAME.run){
    // En extremo el reloj se para EXACTO en la bandera del último nivel.
    if (GAME.run.extremo && i + 1 >= GAME.run.b) GAME.run.fin = performance.now();
    runTick(GAME.run);
    GAME.run.flash = runSplit();
  }
  GAME.mode = 'win'; GAME.wonAt = performance.now();
  SFX.goal(); FX.flash = .7; FX.shake = 6;
  fxBurst(w.L.goal.x + TS/2, w.L.goal.y + TS/2, 30, COL.goal, 200, 120);
}
function medalOf(i, frames){
  const par = LEVELS[i].par, t = frames/60;
  if (t <= par[0]) return 3;
  if (t <= par[1]) return 2;
  if (t <= par[2]) return 1;
  return 0;
}
const MEDAL_ICON = ['', '🥉', '🥈', '🥇'];
function esc(t){
  return String(t == null ? '' : t).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function fmtT(frames){
  if (!frames) return '—';
  const s = frames/60;
  return (s < 60 ? s.toFixed(2) : Math.floor(s/60) + ':' + (s % 60).toFixed(2).padStart(5,'0'));
}

      '<br>' + (r.best ? 'tu récord <b>' + fmtT(r.best) + '</b>' : 'todavía sin récord') +
      (r.star ? '  ·  ★' : '') + '<br><span style="opacity:.7">' + esc(LEVELS[GAME.idx].hint) + '</span>';
  }

// — Bucle principal: acumulador de paso fijo. La pantalla puede ir a 60,
//   90 o 120 Hz; la simulación SIEMPRE avanza de a 1/60 s. —
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.25, (now - GAME.last)/1000);
  GAME.last = now;
  runTick(GAME.run);            // el extremo corre siempre: jugando, en el
                                // respiro entre niveles y en pausa
  if (GAME.mode === 'play' && GAME.w){
    GAME.acc += dt;
    let n = 0;
    while (GAME.acc >= DT && n < 6){
      GAME.acc -= DT; n++;
      const w = GAME.w, inp = pollInput();
      stepWorld(w, inp);
      // El reloj del maratón arranca con tu primer movimiento y ya no para:
      // ni al morir (por eso `on` no se apaga nunca), ni al reintentar.
      if (GAME.run && !GAME.run.extremo){
        if (w.started) GAME.run.on = true;
        if (GAME.run.on) GAME.run.frames++;
      }
      if (w.started && !w.p.dead) ghostRecord(GAME.rec, w.p, w.grav);
      handleEvents(w);
      if (GAME.mode !== 'play') break;
    }
    if (GAME.hintT > 0) GAME.hintT--;
    hudUpdate();
  } else if (GAME.w && GAME.mode === 'win'){
    GAME.w.p.win++;
    const t = performance.now() - GAME.wonAt;
    if (GAME.run){ if (t > 420) runAdvance(); }
    else if (t > 420 && !document.getElementById('scr-win').dataset.on) showWin();
  } else {
    pollInput();
  }
  fxStep(dt);
  if (GAME.w) drawWorld(GAME.w);
  else drawMenuBG();
}
function drawMenuBG(){
  ctx.setTransform(VIEW.s, 0, 0, VIEW.s, VIEW.ox, VIEW.oy);
  drawBG(1);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// El cartel de parcial: el tiempo acumulado y, si hay con qué comparar, cuánto

function splitFlash(acum, delta){

const MERCY = 40;   // muertes en un nivel tras las cuales el siguiente se abre igual
function unlocked(i){
  if (i === 0) return true;
  // Siempre contra el progreso del juego normal: haber terminado el 7 te abre
  // el 8 también en el espejo. Si no, el espejo empezaría de cero y sería un
  // castigo, no un modo.
  const r = lvRec(i-1, '');
  // Trabarse no puede ser el final del juego: si un nivel te comió 40
  // intentos, el siguiente se abre solo. El récord te sigue esperando.
  return !!r.best || r.deaths >= MERCY;
}

    ? 'Joystick a la izquierda · <b>SALTO</b> y <b>DASH</b> a la derecha.<br>' +
      'Pegado a una pared: mantené la dirección y saltá.'
    : '<kbd>← →</kbd> mover · <kbd>Espacio</kbd> saltar · <kbd>X</kbd> dash · ' +
      '<kbd>R</kbd> reintentar · <kbd>Esc</kbd> pausa<br>' +
      'También anda con joystick. Pegado a una pared: dirección + salto.';
  $('pauseHint').innerHTML = 'Reintentar no penaliza: en este juego se muere para aprender.<br>' +
    'Si un nivel se te resiste, después de un rato se abre el siguiente igual.';
}

// ===== js/core.js =====
function boot(){
  loadSave();
  netInit();
  bindUI();
  bindTouch();
  renderOpts();
  if (window.matchMedia && matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');
  layout();
  showScreen('menu');
  requestAnimationFrame(t => { GAME.last = t; frame(t); });
  addEventListener('pointerdown', () => audioResume(), { once:true });
  addEventListener('visibilitychange', () => {
    if (document.hidden && GAME.mode === 'play') togglePause();
  });
  // El navegador móvil no debe hacer zoom ni "pull to refresh" mientras jugás.
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('contextmenu', e => { if (GAME.mode === 'play') e.preventDefault(); });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
</body>
</html>
